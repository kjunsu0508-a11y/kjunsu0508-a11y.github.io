<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>준수가 한국으로 돌아가기까지...</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gowun+Dodum&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   기본
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #111;
    color: white;
    font-family:
        "Fredoka",
        "Gowun Dodum",
        sans-serif;
    overflow-x: hidden;
}


/* =====================================================
   카운트다운
===================================================== */

.time-section {
    width: 100%;
    height: 100vh;
    height: 100svh;
    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    position: relative;
    overflow: hidden;

    padding: 30px 20px;
}

.page-title {
    position: absolute;

    top: 8vh;
    left: 20px;
    right: 20px;

    font-size: clamp(38px, 6vw, 80px);

    font-weight: 700;

    line-height: 1.1;

    letter-spacing: -2px;

    text-shadow:
        3px 4px 0 rgba(0,0,0,.18);

    z-index: 10;
}

.unit {
    font-size: clamp(17px, 2.5vw, 29px);

    font-weight: 600;

    letter-spacing: 8px;

    margin-bottom: 20px;

    color: rgba(255,255,255,.65);
}

.number {
    width: 100%;

    padding: 0 10px;

    font-size: clamp(50px, 12vw, 160px);

    font-weight: 700;

    line-height: 1;

    letter-spacing: -3px;

    font-variant-numeric: tabular-nums;

    white-space: nowrap;

    overflow: hidden;

    text-shadow:
        4px 7px 0 rgba(0,0,0,.18);
}

.description {
    margin-top: 25px;

    font-size: clamp(17px, 2.5vw, 27px);

    font-weight: 500;

    color: rgba(255,255,255,.65);
}


/* =====================================================
   배경
===================================================== */

.years {
    background:
        linear-gradient(
            180deg,
            #172b48,
            #29425e
        );
}

.months {
    background:
        linear-gradient(
            180deg,
            #29425e,
            #443e68
        );
}

.weeks {
    background:
        linear-gradient(
            180deg,
            #443e68,
            #59466a
        );
}

.days {
    background:
        linear-gradient(
            180deg,
            #59466a,
            #6d514d
        );
}

.hours {
    background:
        linear-gradient(
            180deg,
            #6d514d,
            #78513c
        );
}

.minutes {
    background:
        linear-gradient(
            180deg,
            #78513c,
            #52694f
        );
}

.seconds {
    background:
        linear-gradient(
            180deg,
            #52694f,
            #263f40
        );
}


/* =====================================================
   오른쪽 메뉴
===================================================== */

.site-menu {
    position: fixed;

    right: 18px;
    bottom: 18px;

    z-index: 9000;

    display: flex;
    flex-direction: column;

    gap: 9px;
}

.menu-button {
    width: 62px;
    height: 62px;

    border: 3px solid #4e3927;

    border-radius: 10px;

    background: #f4d58d;

    color: #4e3927;

    font-size: 26px;

    cursor: pointer;

    box-shadow:
        4px 5px 0 #38291d;

    transition: .2s;
}

.menu-button:hover {
    transform:
        translateY(-3px)
        rotate(-3deg);

    box-shadow:
        6px 7px 0 #38291d;
}


/* =====================================================
   일기 패널
===================================================== */

.diary-panel {
    position: fixed;

    right: 95px;
    bottom: 18px;

    width:
        min(
            390px,
            calc(100vw - 115px)
        );

    background: #fff4c9;

    color: #493827;

    border: 4px solid #5b402b;

    border-radius: 8px;

    padding: 22px;

    z-index: 8999;

    box-shadow:
        8px 9px 0 rgba(0,0,0,.35);

    opacity: 0;

    transform:
        translateY(20px)
        scale(.95);

    pointer-events: none;

    transition: .2s;
}

.diary-panel.open {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}

.diary-header {
    display: flex;

    justify-content: space-between;

    align-items: center;

    border-bottom:
        2px dashed #b49a68;

    padding-bottom: 12px;

    margin-bottom: 15px;
}

.diary-header h2 {
    margin: 0;
    font-size: 23px;
}

.close-button {
    border: none;

    background: transparent;

    color: #493827;

    font-size: 25px;

    cursor: pointer;
}

.diary-label {
    display: block;

    margin-top: 12px;
    margin-bottom: 5px;

    font-size: 14px;

    font-weight: bold;
}

.diary-textarea {
    width: 100%;

    height: 125px;

    resize: none;

    border:
        2px solid #bba477;

    border-radius: 5px;

    padding: 10px;

    background: #fffbea;

    color: #493827;

    font-family:
        "Gowun Dodum",
        sans-serif;

    font-size: 15px;

    outline: none;
}

.save-diary {
    width: 100%;

    margin-top: 15px;

    padding: 11px;

    border: 3px solid #4e3927;

    border-radius: 5px;

    background: #dfb967;

    color: #4e3927;

    font-family:
        "Fredoka",
        sans-serif;

    font-size: 16px;

    font-weight: 600;

    cursor: pointer;

    box-shadow:
        3px 3px 0 #4e3927;
}

.save-diary:active {
    transform:
        translate(2px,2px);

    box-shadow:
        1px 1px 0 #4e3927;
}


/* =====================================================
   풍선
===================================================== */

#balloon-area {
    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 500;
}

.balloon-wrapper {
    position: absolute;

    width: 130px;
    height: 180px;

    pointer-events: auto;

    cursor: pointer;

    user-select: none;
}

.balloon {
    position: absolute;

    left: 10px;
    top: 0;

    width: 105px;
    height: 125px;

    border-radius:
        50% 50% 48% 48%;

    box-shadow:

        inset
        -13px
        -15px
        20px
        rgba(0,0,0,.13),

        inset
        12px
        10px
        12px
        rgba(255,255,255,.35),

        4px
        7px
        0
        rgba(0,0,0,.15);
}

.balloon::after {
    content: "";

    position: absolute;

    left: 43px;
    bottom: -10px;

    width: 18px;
    height: 18px;

    background: inherit;

    transform: rotate(45deg);
}

.balloon::before {
    content: "";

    position: absolute;

    width: 25px;
    height: 38px;

    left: 18px;
    top: 17px;

    background:
        rgba(255,255,255,.38);

    border-radius: 50%;

    transform: rotate(25deg);
}

.balloon-text {
    position: absolute;

    left: 15px;
    right: 15px;

    top: 43px;

    text-align: center;

    color: white;

    font-family:
        "Gowun Dodum",
        sans-serif;

    font-size: 13px;

    line-height: 1.3;

    font-weight: bold;

    z-index: 2;

    overflow: hidden;

    display: -webkit-box;

    -webkit-line-clamp: 3;

    -webkit-box-orient: vertical;

    text-shadow:
        1px 1px 2px
        rgba(0,0,0,.25);
}

.balloon-string {
    position: absolute;

    left: 62px;
    top: 132px;

    width: 2px;
    height: 47px;

    background:
        rgba(255,255,255,.75);

    transform: rotate(3deg);

    transform-origin: top;
}

.balloon-knot {
    position: absolute;

    left: 53px;
    top: 117px;

    width: 18px;
    height: 18px;

    background: inherit;

    transform: rotate(45deg);

    z-index: 1;
}

.balloon.red {
    background:
        linear-gradient(
            135deg,
            #ff7c8c,
            #d94763
        );
}

.balloon.blue {
    background:
        linear-gradient(
            135deg,
            #75c9ff,
            #4786d9
        );
}

.balloon.yellow {
    background:
        linear-gradient(
            135deg,
            #ffe77b,
            #e8b832
        );
}

.balloon.purple {
    background:
        linear-gradient(
            135deg,
            #c99cff,
            #8961c9
        );
}

.balloon.green {
    background:
        linear-gradient(
            135deg,
            #82dfa2,
            #43a96d
        );
}


/* =====================================================
   일기 보기
===================================================== */

.diary-view {
    position: fixed;

    left: 50%;
    top: 50%;

    width:
        min(
            430px,
            calc(100vw - 40px)
        );

    background: #fff4c9;

    color: #493827;

    border: 4px solid #5b402b;

    border-radius: 8px;

    padding: 25px;

    z-index: 10000;

    box-shadow:
        9px 10px 0
        rgba(0,0,0,.4);

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%,-50%)
        scale(.9);

    transition: .2s;
}

.diary-view.show {
    opacity: 1;

    pointer-events: auto;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.diary-view-date {
    font-size: 14px;

    color: #927957;

    margin-bottom: 12px;

    border-bottom:
        2px dashed #b49a68;

    padding-bottom: 8px;
}

.diary-view-text {
    font-family:
        "Gowun Dodum",
        sans-serif;

    white-space: pre-wrap;

    line-height: 1.7;

    min-height: 80px;

    word-break: break-word;
}

.view-buttons {
    display: flex;

    gap: 10px;

    margin-top: 20px;
}

.delete-diary,
.close-view {
    flex: 1;

    padding: 10px;

    border-radius: 5px;

    font-family:
        "Fredoka",
        sans-serif;

    font-weight: 600;

    cursor: pointer;
}

.delete-diary {
    border:
        3px solid #7b3131;

    background: #ef9999;

    color: #572020;
}

.close-view {
    border:
        3px solid #4e3927;

    background: #dfb967;

    color: #4e3927;
}


/* =====================================================
   =====================================================
   짤방 보드
===================================================== */

#meme-board {
    position: fixed;

    inset: 0;

    background: white;

    color: #222;

    z-index: 20000;

    display: none;

    overflow: hidden;
}

#meme-board.open {
    display: block;
}


/* =====================================================
   짤방 헤더
===================================================== */

.meme-header {
    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 64px;

    background: #f3f3f3;

    border-bottom:
        2px solid #222;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 10px 15px;

    z-index: 30000;
}

.meme-title {
    font-weight: 700;

    font-size: 20px;

    margin-right: auto;
}

.meme-control {
    border:
        2px solid #222;

    background: white;

    color: #222;

    border-radius: 5px;

    padding: 8px 12px;

    font-family:
        "Fredoka",
        sans-serif;

    font-size: 14px;

    cursor: pointer;

    box-shadow:
        2px 2px 0 #222;
}

.meme-control:hover {
    background: #eeeeee;
}

.meme-control:active {
    transform:
        translate(2px,2px);

    box-shadow: none;
}


/* =====================================================
   줌 표시
===================================================== */

.zoom-display {
    min-width: 65px;

    text-align: center;

    font-weight: 600;

    font-size: 14px;
}


/* =====================================================
   짤방 캔버스
===================================================== */

#meme-canvas {
    position: absolute;

    left: 0;
    top: 64px;

    width: 100%;
    height:
        calc(100% - 64px);

    overflow: hidden;

    background: white;

    cursor: grab;
}


/*
   실제 확대/축소되는 공간
*/

#meme-world {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    transform-origin:
        0 0;
}


/* =====================================================
   이미지
===================================================== */

.meme-image {
    position: absolute;

    width: 240px;
    height: auto;

    left: 100px;
    top: 100px;

    cursor: grab;

    user-select: none;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.18);

    border:
        1px solid
        rgba(0,0,0,.1);
}

.meme-image:active {
    cursor: grabbing;
}

.meme-image.selected {
    outline:
        3px dashed #333;

    outline-offset: 4px;
}


/* =====================================================
   이미지 배경 제거 전/후 표시
===================================================== */

.image-status {
    position: absolute;

    left: 15px;
    top: 15px;

    background:
        rgba(255,255,255,.95);

    border:
        1px solid #bbb;

    padding:
        7px 10px;

    font-size: 12px;

    color: #555;

    z-index: 2000;

    pointer-events: none;
}


/* =====================================================
   도움말
===================================================== */

.meme-help {
    position: absolute;

    left: 15px;
    bottom: 12px;

    padding:
        7px 10px;

    background:
        rgba(255,255,255,.9);

    border:
        1px solid #bbb;

    font-size: 12px;

    color: #555;

    z-index: 30000;

    pointer-events: none;
}


/* =====================================================
   크기 패널 제거 대신 배경 제거 안내
===================================================== */

.remove-bg-button {
    display: none;
}


/* =====================================================
   모바일
===================================================== */

@media (max-width: 600px) {

    .page-title {
        top: 7vh;

        font-size:
            clamp(
                34px,
                9vw,
                56px
            );
    }

    .number {
        font-size:
            clamp(
                45px,
                14vw,
                95px
            );
    }

    .unit {
        font-size: 16px;

        letter-spacing: 6px;
    }

    .site-menu {
        right: 12px;
        bottom: 12px;
    }

    .menu-button {
        width: 54px;
        height: 54px;

        font-size: 22px;
    }

    .diary-panel {
        right: 76px;
        bottom: 12px;

        width:
            calc(
                100vw - 88px
            );
    }

    .meme-header {
        height: 58px;

        padding: 8px;
    }

    .meme-title {
        display: none;
    }

    .meme-control {
        padding:
            7px 8px;

        font-size: 12px;
    }

    .zoom-display {
        min-width: 45px;
        font-size: 12px;
    }

    #meme-canvas {
        top: 58px;

        height:
            calc(
                100% - 58px
            );
    }
}

</style>
</head>


<body>


<!-- =====================================================
     카운트다운
===================================================== -->

<!-- =====================================================

<div class="site-menu">

            드래그 → 화면 이동<br>
            이미지 클릭 → 선택<br>
            🤍 → 흰색 배경 제거

        </div>

    </div>

</div>


<script>

/* =====================================================
   카운트다운
===================================================== */

const targetDate =
    new Date(
        2027,
        11,
        31,
        23,
        59,
        59,
        999
    );


const SECOND = 1000;
const MINUTE = SECOND * 60;
const HOUR = MINUTE * 60;
const DAY = HOUR * 24;
const WEEK = DAY * 7;
const YEAR = DAY * 365.2425;
const MONTH = YEAR / 12;


function formatNumber(number) {

    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        }
    );

}


function updateCountdown() {

    const now =
        new Date();

    let remaining =
        targetDate.getTime()
        -
        now.getTime();


    if (remaining < 0) {

        remaining = 0;

    }


    document.getElementById(
        "years"
    ).textContent =
        formatNumber(
            remaining / YEAR
        );


    document.getElementById(
        "months"
    ).textContent =
        formatNumber(
            remaining / MONTH
        );


    document.getElementById(
        "weeks"
    ).textContent =
        formatNumber(
            remaining / WEEK
        );


    document.getElementById(
        "days"
    ).textContent =
        formatNumber(
            remaining / DAY
        );


    document.getElementById(
        "hours"
    ).textContent =
        formatNumber(

/* =====================================================
   풍선 움직임
===================================================== */

function animateBalloons() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    balloons.forEach(
        b => {

            b.x += b.vx;
            b.y += b.vy;


            const rect =
                b.element
                .getBoundingClientRect();


            const w =
                rect.width;

            const h =
                rect.height;


            if (b.x <= 0) {

                b.x = 0;

                b.vx =
                    Math.abs(
                        b.vx
                    );

            }


            if (
                b.x + w >= width
            ) {

                b.x =
                    width - w;

                b.vx =
                    -Math.abs(
                        b.vx
                    );

            }


            if (b.y <= 0) {

                b.y = 0;

                b.vy =
                    Math.abs(
                        b.vy
                    );

            }


            if (
                b.y + h >= height
            ) {

                b.y =
                    height - h;

                b.vy =
                    -Math.abs(
                        b.vy
                    );

            }


            b.element.style.left =
                b.x + "px";

            b.element.style.top =
                b.y + "px";

        }
    );


    for (
        let i = 0;
        i < balloons.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < balloons.length;
            j++
        ) {

            const a =
                balloons[i];

            const b =
                balloons[j];


            const ar =
                a.element
                .getBoundingClientRect();


            const br =
                b.element
                .getBoundingClientRect();


            const hit =
                ar.left < br.right &&
                ar.right > br.left &&
                ar.top < br.bottom &&
                ar.bottom > br.top;


            if (hit) {

                const vx =
                    a.vx;

                const vy =
                    a.vy;


                a.vx =
                    b.vx;

                a.vy =
                    b.vy;


                b.vx =
                    vx;

                b.vy =
                    vy;

            }

        }

    }


    requestAnimationFrame(
        animateBalloons
    );

}

function changeZoom(amount) {

    const oldZoom =
        boardZoom;


    boardZoom =
        Math.max(
            .25,
            Math.min(
                4,
                boardZoom + amount
            )
        );


    /*
       마우스 휠로 확대할 때
       화면 중앙을 기준으로 확대
    */

    const rect =
        memeCanvas.getBoundingClientRect();


    const centerX =
        rect.width / 2;

    const centerY =
        rect.height / 2;


    const worldX =
        (centerX - boardPanX)
        / oldZoom;


    const worldY =
        (centerY - boardPanY)
        / oldZoom;


    boardPanX =
        centerX
        -
        worldX * boardZoom;


    boardPanY =
        centerY
        -
        worldY * boardZoom;


    updateWorldTransform();

}

        const oldZoom =
            boardZoom;


        const direction =
            event.deltaY < 0
            ? 1
            : -1;


        const newZoom =
            Math.max(
                .25,
                Math.min(
                    4,
                    oldZoom
                    +
                    direction * .1
                )
            );


        const rect =
            memeCanvas
            .getBoundingClientRect();


        /*
           마우스 위치를 기준으로 줌
        */

        const mouseX =
            event.clientX
            -
            rect.left;


        const mouseY =
            event.clientY
            -
            rect.top;


        const worldX =
            (mouseX - boardPanX)
            / oldZoom;


        const worldY =
            (mouseY - boardPanY)
            / oldZoom;


        boardZoom =
            newZoom;


        boardPanX =
            mouseX
            -
            worldX * boardZoom;


        boardPanY =
            mouseY
            -
            worldY * boardZoom;


        updateWorldTransform();

    },
    {
        passive: false
    }
);

/* =====================================================

   =====================================================
===================================================== */

/*
   이미지의 가장자리에서 시작하여
   흰색에 가까운 영역을 찾아 투명하게 만든다.

   따라서 캐릭터 내부의 흰색까지
   무조건 지우는 방식이 아니다.
*/


function removeWhiteBackground(
    imageDataURL
) {

    return new Promise(
        resolve => {

            const img =
                new Image();


            img.onload =
                () => {

                    const canvas =
                        document.createElement(
                            "canvas"
                        );


                    const ctx =
                        canvas.getContext(
                            "2d"
                        );


                    canvas.width =
                        img.naturalWidth;


                    canvas.height =
                        img.naturalHeight;


                    ctx.drawImage(
                        img,
                        0,
                        0
                    );


                    const imageData =
                        ctx.getImageData(
                            0,
                            0,
                            canvas.width,
                            canvas.height
                        );


                    const pixels =
                        imageData.data;


                    const width =
                        canvas.width;

                    const height =
                        canvas.height;


                    /*
                       방문 여부
                    */

                    const visited =
                        new Uint8Array(
                            width * height
                        );


                    /*
                       큐
                    */

                    const queue = [];


                    /*
                       흰색 판단

                       숫자가 작을수록
                       더 엄격하게 흰색만 제거
                    */

                    function isWhite(
                        index
                    ) {

                        const r =
                            pixels[index];

                        const g =
                            pixels[index + 1];

                        const b =
                            pixels[index + 2];

                        const a =
                            pixels[index + 3];


                        if (a === 0) {

                            return true;

                        }


                        return (
                            r > 235 &&
                            g > 235 &&
                            b > 235
                        );

                    }


                    /*
                       가장자리 픽셀 넣기
                    */

                    function addPixel(
                        x,
                        y
                    ) {

                        if (
                            x < 0 ||
                            y < 0 ||
                            x >= width ||
                            y >= height
                        ) {

                            return;

                        }


                        const pos =
                            y * width + x;


                        if (
                            visited[pos]
                        ) {

                            return;

                        }


                        const index =
                            pos * 4;


                        if (
                            !isWhite(index)
                        ) {

                            return;

                        }


                        visited[pos] =
                            1;


                        queue.push(
                            pos
                        );

                    }


                    /*
                       위/아래/왼쪽/오른쪽
                    */

                    for (
                        let x = 0;
                        x < width;
                        x++
                    ) {

                        addPixel(
                            x,
                            0
                        );

                        addPixel(
                            x,
                            height - 1
                        );

                    }


                    for (
                        let y = 0;
                        y < height;
                        y++
                    ) {

                        addPixel(
                            0,
                            y
                        );

                        addPixel(
                            width - 1,
                            y
                        );

                    }


                    /*
                       Flood Fill
                    */

                    let index = 0;


                    while (
                        index <
                        queue.length
                    ) {

                        const pos =
                            queue[index++];


                        const x =
                            pos % width;


                        const y =
                            Math.floor(
                                pos / width
                            );


                        const pixelIndex =
                            pos * 4;


                        /*
                           투명하게 만들기
                        */

                        pixels[
                            pixelIndex + 3
                        ] = 0;


                        /*
                           주변 픽셀
                        */

                        addPixel(
                            x + 1,
                            y
                        );

                        addPixel(
                            x - 1,
                            y
                        );

                        addPixel(
                            x,
                            y + 1
                        );

                        addPixel(
                            x,
                            y - 1
                        );

                    }


                    ctx.putImageData(
                        imageData,
                        0,
                        0
                    );


                    resolve(
                        canvas.toDataURL(
                            "image/png"
                        )
                    );

                };


            img.src =
                imageDataURL;

        }
    );

}


/* =====================================================
   배경 제거 버튼
===================================================== */

removeBackground.addEventListener(
    "click",
    async () => {

        if (
            !selectedImage
        ) {

            alert(
                "먼저 배경을 제거할 이미지를 클릭해 주세요."
            );

            return;

        }


        const data =
            selectedImage.data;


        const element =
            selectedImage.element;


        if (
            data.backgroundRemoved
        ) {

            alert(
                "이 이미지는 이미 배경을 제거했습니다."
            );

            return;

        }


        removeBackground.disabled =
            true;


        removeBackground.textContent =
            "⏳ 처리 중...";


        try {

            const newImage =
                await removeWhiteBackground(
                    data.src
                );


            data.src =
                newImage;


            data.backgroundRemoved =
                true;


            /*
               현재 선택된 이미지 교체
            */

            element.src =
                newImage;


            saveMemeImages();


        }
        catch(error) {

            console.error(
                error
            );


            alert(
                "배경 제거 중 문제가 발생했습니다."
            );

        }


        removeBackground.disabled =
            false;


        removeBackground.textContent =
            "🤍 배경 제거";

    }
);


/* =====================================================
   ESC로 짤방 보드 닫기
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
            &&
            memeBoard.classList.contains(
                "open"
            )
        ) {

            memeBoard.classList.remove(
                "open"
            );

        }

    }
);


/* =====================================================
   창 크기 변경
===================================================== */

window.addEventListener(
    "resize",
    () => {

        balloons.forEach(
            b => {

                b.x =
                    Math.min(
                        b.x,
                        window.innerWidth - 140
                    );


                b.y =
                    Math.min(
                        b.y,
                        window.innerHeight - 190
                    );

            }
        );

    }
);
