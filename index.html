<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>준수가 한국으로 돌아가기까지...</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    font-family:
        "Arial Rounded MT Bold",
        "Trebuchet MS",
        Arial,
        sans-serif;

    color: white;

    background: #111;

    overflow-x: hidden;
}


/* =================================
   모든 시간 화면
   ================================= */

.time-section {

    width: 100%;

    /*
        모바일 주소창 때문에 100vh가
        실제 화면보다 커지는 문제를 방지
    */

    min-height: 100vh;
    min-height: 100svh;

    height: 100vh;
    height: 100svh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding:
        40px 25px;

    position: relative;

    overflow: hidden;
}


/* =================================
   첫 번째 화면 제목
   ================================= */

.page-title {

    position: relative;

    font-size:
        clamp(24px, 4vw, 46px);

    font-weight: 900;

    line-height: 1.2;

    letter-spacing: -1.5px;

    margin-bottom: 50px;

    max-width: 900px;

    text-shadow:
        0 5px 25px rgba(0,0,0,0.25);
}


/* =================================
   단위
   ================================= */

.unit {

    position: relative;

    font-size:
        clamp(17px, 2.5vw, 26px);

    font-weight: 800;

    letter-spacing: 7px;

    margin-bottom: 20px;

    color:
        rgba(255,255,255,0.65);
}


/* =================================
   숫자
   ================================= */

.number {

    position: relative;

    /*
        이전보다 확실히 작게 해서
        어떤 화면에서도 잘리지 않게 함
    */

    font-size:
        clamp(55px, 13vw, 170px);

    line-height: 0.95;

    font-weight: 900;

    letter-spacing: -5px;

    font-variant-numeric:
        tabular-nums;

    white-space: nowrap;

    max-width: 100%;

    text-shadow:
        0 10px 35px rgba(0,0,0,0.3);
}


/* =================================
   설명
   ================================= */

.description {

    position: relative;

    margin-top: 25px;

    font-size:
        clamp(17px, 2.5vw, 27px);

    font-weight: 700;

    color:
        rgba(255,255,255,0.6);
}


/* =================================
   화면별 자연스러운 색 변화

   차가운 색 → 따뜻한 색 → 다시 차가운 색
   ================================= */

.years {

    background:
        linear-gradient(
            180deg,
            #182a45 0%,
            #263c5a 100%
        );
}


.months {

    background:
        linear-gradient(
            180deg,
            #263c5a 0%,
            #3b3a65 100%
        );
}


.weeks {

    background:
        linear-gradient(
            180deg,
            #3b3a65 0%,
            #514565 100%
        );
}


.days {

    background:
        linear-gradient(
            180deg,
            #514565 0%,
            #66504f 100%
        );
}


.hours {

    background:
        linear-gradient(
            180deg,
            #66504f 0%,
            #76543f 100%
        );
}


.minutes {

    background:
        linear-gradient(
            180deg,
            #76543f 0%,
            #536a55 100%
        );
}


.seconds {

    background:
        linear-gradient(
            180deg,
            #536a55 0%,
            #263f3f 100%
        );
}


/* =================================
   모바일
   ================================= */

@media (max-width: 600px) {

    .time-section {

        padding:
            30px 18px;
    }

    .page-title {

        font-size:
            clamp(22px, 7vw, 34px);

        margin-bottom: 38px;
    }

    .unit {

        font-size: 16px;

        letter-spacing: 5px;

        margin-bottom: 18px;
    }

    .number {

        font-size:
            clamp(48px, 15vw, 100px);

        letter-spacing: -3px;
    }

    .description {

        margin-top: 20px;

        font-size: 17px;
    }
}

</style>
</head>


<body>


<!-- =================================
     YEARS
     제목은 여기에서만 표시
     ================================= -->

<section class="time-section years">

    <div class="page-title">
        준수가 한국으로 돌아가기까지...
    </div>

    <div class="unit">
        YEARS
    </div>

    <div
        class="number"
        id="years">
        0.0
    </div>

    <div class="description">
        년으로 보면
    </div>

</section>



<!-- =================================
     MONTHS
     ================================= -->

<section class="time-section months">

    <div class="unit">
        MONTHS
    </div>

    <div
        class="number"
        id="months">
        0.0
    </div>

    <div class="description">
        달로 보면
    </div>

</section>



<!-- =================================
     WEEKS
     ================================= -->

<section class="time-section weeks">

    <div class="unit">
        WEEKS
    </div>

    <div
        class="number"
        id="weeks">
        0.0
    </div>

    <div class="description">
        주일로 보면
    </div>

</section>



<!-- =================================
     DAYS
     ================================= -->

<section class="time-section days">

    <div class="unit">
        DAYS
    </div>

    <div
        class="number"
        id="days">
        0.0
    </div>

    <div class="description">
        일로 보면
    </div>

</section>



<!-- =================================
     HOURS
     ================================= -->

<section class="time-section hours">

    <div class="unit">
        HOURS
    </div>

    <div
        class="number"
        id="hours">
        0.0
    </div>

    <div class="description">
        시간으로 보면
    </div>

</section>



<!-- =================================
     MINUTES
     ================================= -->

<section class="time-section minutes">

    <div class="unit">
        MINUTES
    </div>

    <div
        class="number"
        id="minutes">
        0.0
    </div>

    <div class="description">
        분으로 보면
    </div>

</section>



<!-- =================================
     SECONDS
     ================================= -->

<section class="time-section seconds">

    <div class="unit">
        SECONDS
    </div>

    <div
        class="number"
        id="seconds">
        0.0
    </div>

    <div class="description">
        초로 보면
    </div>

</section>



<script>


/* =================================
   목표 날짜

   2027년 12월 31일
   23:59:59.999
   ================================= */

const targetDate =
    new Date(
        2027,
        11,
        31,
        23,
        59,
        59,
        999
    );


/* =================================
   시간 단위
   ================================= */

const SECOND = 1000;

const MINUTE =
    SECOND * 60;

const HOUR =
    MINUTE * 60;

const DAY =
    HOUR * 24;

const WEEK =
    DAY * 7;


/*
   평균 1년
*/

const YEAR =
    DAY * 365.2425;


/*
   평균 1개월
*/

const MONTH =
    YEAR / 12;



/* =================================
   숫자 포맷
   ================================= */

function formatNumber(number) {

    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        }
    );

}



/* =================================
   카운트다운
   ================================= */

function updateCountdown() {

    const now =
        new Date();


    let remaining =
        targetDate.getTime()
        -
        now.getTime();


    if (remaining < 0) {

        remaining = 0;

    }


    /*
        같은 남은 시간을
        각각의 단위로 환산
    */

    const years =
        remaining / YEAR;

    const months =
        remaining / MONTH;

    const weeks =
        remaining / WEEK;

    const days =
        remaining / DAY;

    const hours =
        remaining / HOUR;

    const minutes =
        remaining / MINUTE;

    const seconds =
        remaining / SECOND;



    /*
        화면 업데이트
    */

    document.getElementById(
        "years"
    ).textContent =
        formatNumber(years);


    document.getElementById(
        "months"
    ).textContent =
        formatNumber(months);


    document.getElementById(
        "weeks"
    ).textContent =
        formatNumber(weeks);


    document.getElementById(
        "days"
    ).textContent =
        formatNumber(days);


    document.getElementById(
        "hours"
    ).textContent =
        formatNumber(hours);


    document.getElementById(
        "minutes"
    ).textContent =
        formatNumber(minutes);


    document.getElementById(
        "seconds"
    ).textContent =
        formatNumber(seconds);

}


/* 처음 실행 */

updateCountdown();


/*
   0.1초마다 업데이트
*/

setInterval(
    updateCountdown,
    100
);

</script>

</body>
</html>
