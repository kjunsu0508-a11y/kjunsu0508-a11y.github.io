<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>준수가 한국으로 돌아가기까지...</title>

<style>

/* =========================
   기본 설정
   ========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    background: #080808;

    color: white;

    font-family:
        "Arial Rounded MT Bold",
        "Trebuchet MS",
        Arial,
        sans-serif;
}


/* =========================
   맨 처음 제목
   ========================= */

.hero {
    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 40px 25px;

    background:
        radial-gradient(
            circle at 20% 20%,
            #31496b 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            #35213e 0%,
            transparent 40%
        ),
        #080808;
}


.hero-title {

    font-size:
        clamp(45px, 9vw, 120px);

    line-height: 1.05;

    font-weight: 900;

    letter-spacing: -4px;

    max-width: 1100px;

    text-shadow:
        0 10px 40px rgba(0,0,0,0.5);
}


/* =========================
   시간 화면
   ========================= */

.time-section {

    min-height: 100vh;

    width: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    padding: 50px 20px;

    position: relative;

    overflow: hidden;
}


/* 배경에 은은한 빛 */

.time-section::before {

    content: "";

    position: absolute;

    width: 700px;

    height: 700px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,0.08),
            transparent 70%
        );

    filter: blur(30px);

    pointer-events: none;
}


/* =========================
   단위 이름
   ========================= */

.unit {

    position: relative;

    font-size:
        clamp(18px, 3vw, 30px);

    font-weight: 800;

    letter-spacing: 10px;

    color:
        rgba(255,255,255,0.55);

    margin-bottom: 30px;
}


/* =========================
   엄청 큰 숫자
   ========================= */

.number {

    position: relative;

    font-size:
        clamp(90px, 20vw, 280px);

    line-height: 0.9;

    font-weight: 900;

    letter-spacing: -10px;

    font-variant-numeric:
        tabular-nums;

    white-space: nowrap;

    text-shadow:
        0 15px 50px rgba(0,0,0,0.45);
}


/* 숫자 밑 설명 */

.description {

    position: relative;

    margin-top: 45px;

    font-size:
        clamp(18px, 3vw, 30px);

    font-weight: 700;

    color:
        rgba(255,255,255,0.5);
}


/* =========================
   각 화면 배경
   ========================= */

.years {

    background:
        linear-gradient(
            135deg,
            #101c30,
            #080808
        );
}


.months {

    background:
        linear-gradient(
            135deg,
            #28192f,
            #080808
        );
}


.weeks {

    background:
        linear-gradient(
            135deg,
            #142c2b,
            #080808
        );
}


.days {

    background:
        linear-gradient(
            135deg,
            #302718,
            #080808
        );
}


.hours {

    background:
        linear-gradient(
            135deg,
            #292929,
            #080808
        );
}


.minutes {

    background:
        linear-gradient(
            135deg,
            #172936,
            #080808
        );
}


.seconds {

    background:
        linear-gradient(
            135deg,
            #311c1c,
            #080808
        );
}


/* =========================
   모바일
   ========================= */

@media (max-width: 600px) {

    .hero-title {

        font-size:
            clamp(42px, 13vw, 75px);

        letter-spacing: -3px;
    }

    .number {

        font-size:
            clamp(70px, 22vw, 130px);

        letter-spacing: -5px;
    }

    .unit {

        letter-spacing: 6px;

        margin-bottom: 25px;
    }

}

</style>
</head>


<body>


<!-- =================================
     맨 처음 제목
     ================================= -->

<section class="hero">

    <div class="hero-title">
        준수가 한국으로<br>
        돌아가기까지...
    </div>

</section>



<!-- =================================
     YEARS
     ================================= -->

<section class="time-section years">

    <div class="unit">
        YEARS
    </div>

    <div
        class="number"
        id="years">
        0.0
    </div>

    <div class="description">
        년으로 보면
    </div>

</section>



<!-- =================================
     MONTHS
     ================================= -->

<section class="time-section months">

    <div class="unit">
        MONTHS
    </div>

    <div
        class="number"
        id="months">
        0.0
    </div>

    <div class="description">
        달로 보면
    </div>

</section>



<!-- =================================
     WEEKS
     ================================= -->

<section class="time-section weeks">

    <div class="unit">
        WEEKS
    </div>

    <div
        class="number"
        id="weeks">
        0.0
    </div>

    <div class="description">
        주일로 보면
    </div>

</section>



<!-- =================================
     DAYS
     ================================= -->

<section class="time-section days">

    <div class="unit">
        DAYS
    </div>

    <div
        class="number"
        id="days">
        0.0
    </div>

    <div class="description">
        일로 보면
    </div>

</section>



<!-- =================================
     HOURS
     ================================= -->

<section class="time-section hours">

    <div class="unit">
        HOURS
    </div>

    <div
        class="number"
        id="hours">
        0.0
    </div>

    <div class="description">
        시간으로 보면
    </div>

</section>



<!-- =================================
     MINUTES
     ================================= -->

<section class="time-section minutes">

    <div class="unit">
        MINUTES
    </div>

    <div
        class="number"
        id="minutes">
        0.0
    </div>

    <div class="description">
        분으로 보면
    </div>

</section>



<!-- =================================
     SECONDS
     ================================= -->

<section class="time-section seconds">

    <div class="unit">
        SECONDS
    </div>

    <div
        class="number"
        id="seconds">
        0.0
    </div>

    <div class="description">
        초로 보면
    </div>

</section>



<script>


/* =================================
   목표 날짜

   2027년 12월 31일
   23:59:59.999
   ================================= */

const targetDate =
    new Date(
        2027,
        11,
        31,
        23,
        59,
        59,
        999
    );


/* =================================
   시간 단위
   ================================= */

const SECOND =
    1000;

const MINUTE =
    SECOND * 60;

const HOUR =
    MINUTE * 60;

const DAY =
    HOUR * 24;

const WEEK =
    DAY * 7;


/*
    1년의 평균 길이

    윤년까지 고려한 평균값
*/

const YEAR =
    DAY * 365.2425;


/*
    평균적인 1개월
*/

const MONTH =
    YEAR / 12;



/* =================================
   숫자를 소수점 한 자리로 표시
   ================================= */

function formatNumber(number) {

    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        }
    );

}



/* =================================
   카운트다운
   ================================= */

function updateCountdown() {

    const now =
        new Date();


    let remaining =
        targetDate.getTime()
        -
        now.getTime();


    /*
        시간이 끝나면 0
    */

    if (remaining <= 0) {

        remaining = 0;

    }


    /*
        각각의 단위로
        남은 시간을 표현
    */

    const years =
        remaining / YEAR;

    const months =
        remaining / MONTH;

    const weeks =
        remaining / WEEK;

    const days =
        remaining / DAY;

    const hours =
        remaining / HOUR;

    const minutes =
        remaining / MINUTE;

    const seconds =
        remaining / SECOND;



    /*
        화면에 표시
    */

    document.getElementById(
        "years"
    ).textContent =
        formatNumber(years);


    document.getElementById(
        "months"
    ).textContent =
        formatNumber(months);


    document.getElementById(
        "weeks"
    ).textContent =
        formatNumber(weeks);


    document.getElementById(
        "days"
    ).textContent =
        formatNumber(days);


    document.getElementById(
        "hours"
    ).textContent =
        formatNumber(hours);


    document.getElementById(
        "minutes"
    ).textContent =
        formatNumber(minutes);


    document.getElementById(
        "seconds"
    ).textContent =
        formatNumber(seconds);

}



/* =================================
   처음 실행
   ================================= */

updateCountdown();



/*
   0.1초마다 업데이트

   10.0
   9.9
   9.8
   9.7
   ...
*/

setInterval(
    updateCountdown,
    100
);

</script>

</body>
</html>
