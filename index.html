<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>준수가 한국으로 돌아가기까지...</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, Helvetica, sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 20% 20%,
            #243b55 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            #141e30 0%,
            transparent 40%
        ),
        #050505;

    overflow-x: hidden;
}


.container {
    width: min(1100px, 92%);

    padding: 45px;

    text-align: center;

    background: rgba(255,255,255,0.06);

    border:
        1px solid rgba(255,255,255,0.12);

    border-radius: 30px;

    backdrop-filter: blur(20px);

    box-shadow:
        0 30px 80px rgba(0,0,0,0.5);
}


.title {
    margin-bottom: 45px;

    font-size:
        clamp(25px, 4vw, 50px);

    font-weight: 600;

    letter-spacing: -1px;
}


.main {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 15px;
}


.card {
    padding: 28px 10px;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.05);

    border:
        1px solid rgba(255,255,255,0.08);

    transition: 0.3s;
}


.card:hover {
    transform: translateY(-5px);

    background:
        rgba(255,255,255,0.09);
}


.number {
    font-size:
        clamp(28px, 5vw, 58px);

    font-weight: bold;

    letter-spacing: -2px;

    font-variant-numeric:
        tabular-nums;

    white-space: nowrap;
}


/* 초를 조금 더 강조 */

#seconds {
    text-shadow:
        0 0 20px rgba(255,255,255,0.45);
}


.label {
    margin-top: 10px;

    font-size: 12px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,0.45);
}


.message {
    margin-top: 35px;

    font-size: 22px;

    font-weight: bold;

    letter-spacing: 2px;
}


@media (max-width: 700px) {

    .container {
        padding: 30px 15px;
    }

    .main {
        grid-template-columns:
            repeat(2, 1fr);
    }

    .number {
        font-size: 30px;
    }

}

</style>
</head>


<body>

<div class="container">

    <div class="title">
        준수가 한국으로 돌아가기까지...
    </div>


    <div class="main">

        <div class="card">
            <div
                class="number"
                id="years">
                0.0
            </div>

            <div class="label">
                YEARS
            </div>
        </div>


        <div class="card">
            <div
                class="number"
                id="months">
                0.0
            </div>

            <div class="label">
                MONTHS
            </div>
        </div>


        <div class="card">
            <div
                class="number"
                id="weeks">
                0.0
            </div>

            <div class="label">
                WEEKS
            </div>
        </div>


        <div class="card">
            <div
                class="number"
                id="days">
                0.0
            </div>

            <div class="label">
                DAYS
            </div>
        </div>


        <div class="card">
            <div
                class="number"
                id="hours">
                0.0
            </div>

            <div class="label">
                HOURS
            </div>
        </div>


        <div class="card">
            <div
                class="number"
                id="minutes">
                0.0
            </div>

            <div class="label">
                MINUTES
            </div>
        </div>


        <div class="card">
            <div
                class="number"
                id="seconds">
                0.0
            </div>

            <div class="label">
                SECONDS
            </div>
        </div>

    </div>


    <div
        class="message"
        id="message">
    </div>

</div>


<script>


/*
    ====================================
    목표 날짜
    ====================================

    2027년 12월 31일
    오후 11시 59분 59.999초

    즉, 2027년 12월 31일이
    끝나는 순간까지 카운트다운.
*/

const targetDate =
    new Date(
        2027,
        11,
        31,
        23,
        59,
        59,
        999
    );


/*
    1초 = 1000밀리초
*/

const SECOND =
    1000;


/*
    1분
*/

const MINUTE =
    SECOND * 60;


/*
    1시간
*/

const HOUR =
    MINUTE * 60;


/*
    1일
*/

const DAY =
    HOUR * 24;


/*
    1주일
*/

const WEEK =
    DAY * 7;


/*
    평균적인 달의 길이

    365.2425일 ÷ 12개월
*/

const MONTH =
    DAY * (365.2425 / 12);


/*
    평균적인 1년
*/

const YEAR =
    DAY * 365.2425;



/*
    숫자를 항상 소수점
    한 자리로 표시
*/

function formatNumber(number) {

    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        }
    );

}



/*
    카운트다운 업데이트
*/

function updateCountdown() {


    /*
        현재 시간
    */

    const now =
        new Date();


    /*
        목표 날짜까지 남은 시간

        밀리초 단위
    */

    let remaining =
        targetDate.getTime()
        -
        now.getTime();



    /*
        시간이 끝났으면
    */

    if (remaining <= 0) {

        document.getElementById(
            "years"
        ).textContent = "0.0";


        document.getElementById(
            "months"
        ).textContent = "0.0";


        document.getElementById(
            "weeks"
        ).textContent = "0.0";


        document.getElementById(
            "days"
        ).textContent = "0.0";


        document.getElementById(
            "hours"
        ).textContent = "0.0";


        document.getElementById(
            "minutes"
        ).textContent = "0.0";


        document.getElementById(
            "seconds"
        ).textContent = "0.0";


        document.getElementById(
            "message"
        ).textContent =
            "한국 도착! 🇰🇷";


        return;
    }



    /*
        ====================================
        모든 단위를 "전체 남은 시간"으로 계산
        ====================================
    */


    const years =
        remaining / YEAR;


    const months =
        remaining / MONTH;


    const weeks =
        remaining / WEEK;


    const days =
        remaining / DAY;


    const hours =
        remaining / HOUR;


    const minutes =
        remaining / MINUTE;


    const seconds =
        remaining / SECOND;



    /*
        화면에 표시
    */

    document.getElementById(
        "years"
    ).textContent =
        formatNumber(years);


    document.getElementById(
        "months"
    ).textContent =
        formatNumber(months);


    document.getElementById(
        "weeks"
    ).textContent =
        formatNumber(weeks);


    document.getElementById(
        "days"
    ).textContent =
        formatNumber(days);


    document.getElementById(
        "hours"
    ).textContent =
        formatNumber(hours);


    document.getElementById(
        "minutes"
    ).textContent =
        formatNumber(minutes);


    document.getElementById(
        "seconds"
    ).textContent =
        formatNumber(seconds);

}


/*
    처음 실행
*/

updateCountdown();


/*
    ⭐ 0.1초마다 업데이트

    10.0
    9.9
    9.8
    9.7
    ...
*/

setInterval(
    updateCountdown,
    100
);

</script>

</body>
</html>
