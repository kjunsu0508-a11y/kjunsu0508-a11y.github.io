<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junsoo's Room</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap');

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: 'Jua', sans-serif;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 25%),
        linear-gradient(135deg,#dff6ff,#f9e8ff,#fff7d6);
    color: #252033;
    overflow-x: hidden;
    transition: filter .5s, background .5s;
}

/* =========================
   MAIN
========================= */

#app {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
}

.header {
    text-align: center;
    padding-top: 55px;
    position: relative;
    z-index: 10;
}

.header h1 {
    margin: 0;
    font-size: clamp(40px, 7vw, 90px);
    letter-spacing: -3px;
    text-shadow:
        4px 4px 0 rgba(255,255,255,.8),
        7px 7px 0 rgba(100,80,140,.15);
}

.header p {
    margin-top: 8px;
    font-size: 18px;
    opacity: .65;
}

/* =========================
   COUNTDOWN
========================= */

.countdown {
    min-height: 100vh;
    padding: 45px 20px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.targetBox {
    margin-bottom: 35px;
    text-align: center;
}

.targetBox input {
    padding: 12px 16px;
    border: none;
    border-radius: 20px;
    background: rgba(255,255,255,.8);
    font-family: inherit;
    font-size: 16px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.units {
    width: min(1200px, 95vw);
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(190px,1fr));
    gap: 20px;
}

.unit {
    min-height: 190px;
    border-radius: 35px;
    padding: 25px 15px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: rgba(255,255,255,.55);
    backdrop-filter: blur(15px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.08),
        inset 0 1px 0 rgba(255,255,255,.8);

    transition:
        transform .3s,
        background .8s;
}

.unit:hover {
    transform: translateY(-8px) rotate(-1deg);
}

.number {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(28px,5vw,55px);
    line-height: 1.2;
    word-break: break-all;
}

.label {
    margin-top: 15px;
    font-size: 22px;
    opacity: .7;
}

/* =========================
   SIDE MENU
========================= */

.menuButton {
    position: fixed;
    right: 20px;
    top: 20px;
    z-index: 1000;

    width: 60px;
    height: 60px;
    border: none;
    border-radius: 50%;

    background: rgba(255,255,255,.85);
    box-shadow: 0 8px 25px rgba(0,0,0,.15);

    font-size: 28px;
    cursor: pointer;
}

.menu {
    position: fixed;
    right: 20px;
    top: 90px;
    width: 270px;
    max-height: calc(100vh - 110px);
    overflow-y: auto;

    background: rgba(255,255,255,.92);
    backdrop-filter: blur(20px);

    border-radius: 30px;
    padding: 20px;

    box-shadow: 0 20px 60px rgba(0,0,0,.2);

    z-index: 999;

    transform: translateX(130%);
    transition: transform .4s;
}

.menu.open {
    transform: translateX(0);
}

.menu button,
.menu label {
    width: 100%;
    display: block;

    padding: 13px;
    margin-bottom: 9px;

    border: none;
    border-radius: 15px;

    background: #f1edff;
    color: #302942;

    font-family: inherit;
    font-size: 16px;

    cursor: pointer;
}

.menu button:hover,
.menu label:hover {
    background: #ded4ff;
}

.menuTitle {
    text-align: center;
    font-size: 22px;
    margin-bottom: 15px;
}

#imageInput {
    display: none;
}

/* =========================
   IMAGE BOARD
========================= */

#board {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
}

.boardImage {
    position: absolute;
    max-width: 250px;
    max-height: 250px;

    pointer-events: auto;
    cursor: move;

    user-select: none;

    filter: drop-shadow(0 10px 15px rgba(0,0,0,.2));

    transition: transform .15s;
}

.boardImage:hover {
    transform: scale(1.04);
}

/* =========================
   GAME MODE
========================= */

.gamePanel {
    display: none;
}

body.gameMode .gamePanel {
    display: block;
}

.gamePanel {
    position: fixed;
    left: 20px;
    top: 20px;
    z-index: 900;

    min-width: 190px;

    padding: 15px 18px;

    background: rgba(255,255,255,.9);
    backdrop-filter: blur(15px);

    border-radius: 22px;

    box-shadow: 0 10px 30px rgba(0,0,0,.15);
}

.coin {
    font-family: 'Press Start 2P', monospace;
    font-size: 15px;
}

.coinAmount {
    font-size: 25px;
    margin-top: 8px;
}

.gameButtons {
    margin-top: 12px;
}

.gameButtons button {
    border: none;
    border-radius: 12px;
    padding: 8px 10px;
    margin: 2px;

    font-family: inherit;
    cursor: pointer;
}

/* =========================
   PET
========================= */

#pet {
    display: none;
    position: fixed;

    width: 90px;
    height: 90px;

    z-index: 300;

    pointer-events: none;

    filter: drop-shadow(0 8px 8px rgba(0,0,0,.18));

    user-select: none;
}

body.gameMode #pet {
    display: block;
}

/* =========================
   SHOP
========================= */

.shop {
    position: fixed;
    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%) scale(.8);

    width: min(420px,90vw);
    max-height: 80vh;
    overflow-y: auto;

    background: rgba(255,255,255,.96);
    border-radius: 30px;

    padding: 25px;

    box-shadow: 0 30px 100px rgba(0,0,0,.3);

    z-index: 2000;

    opacity: 0;
    pointer-events: none;

    transition: .3s;
}

.shop.active {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%,-50%) scale(1);
}

.shop h2 {
    text-align: center;
}

.shopItem {
    background: #f4efff;
    border-radius: 18px;
    padding: 15px;
    margin: 10px 0;
}

.shopItem button {
    border: none;
    border-radius: 10px;
    padding: 8px 14px;
    cursor: pointer;
    font-family: inherit;
}

/* =========================
   RANDOM EVENT
========================= */

#eventText {
    position: fixed;
    left: 50%;
    top: 20%;

    transform: translate(-50%,-50%) scale(.5);

    padding: 20px 30px;

    border-radius: 30px;

    background: rgba(255,255,255,.95);

    font-size: 28px;
    text-align: center;

    box-shadow: 0 20px 60px rgba(0,0,0,.2);

    z-index: 5000;

    opacity: 0;
    pointer-events: none;

    transition: .4s;
}

#eventText.show {
    opacity: 1;
    transform: translate(-50%,-50%) scale(1);
}

/* =========================
   INK EVENT
========================= */

.ink {
    position: fixed;
    border-radius: 50%;
    z-index: 4000;
    pointer-events: none;

    background: #32206f;

    animation: inkPop 1.5s forwards;
}

@keyframes inkPop {
    0% {
        transform: scale(.1);
        opacity: 0;
    }

    20% {
        opacity: .85;
    }

    100% {
        transform: scale(2);
        opacity: 0;
    }
}

/* =========================
   SECRET
========================= */

#secret {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(20,15,35,.9);

    z-index: 9000;

    color: white;
    text-align: center;
}

#secret.active {
    display: flex;
}

.secretBox {
    font-size: 28px;
    padding: 40px;
}

.secretBox button {
    margin-top: 20px;
    border: none;
    padding: 12px 25px;
    border-radius: 20px;
    font-family: inherit;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .header {
        padding-top: 80px;
    }

    .units {
        grid-template-columns: 1fr;
    }

    .unit {
        min-height: 150px;
    }

    .gamePanel {
        left: 10px;
        top: 10px;
    }

    .menuButton {
        right: 10px;
        top: 10px;
    }

    .menu {
        right: 10px;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- GAME UI -->
    <div class="gamePanel">

        <div class="coin">
            🪙 RIPPLE COIN
        </div>

        <div class="coinAmount" id="coinAmount">
            0
        </div>

        <div class="gameButtons">
            <button onclick="openGacha()">🎁 뽑기</button>
            <button onclick="openShop()">🛒 상점</button>
            <button onclick="randomEvent()">🎲 이벤트</button>
        </div>

    </div>


    <!-- MENU BUTTON -->
    <button class="menuButton" onclick="toggleMenu()">
        ☰
    </button>


    <!-- SIDE MENU -->
    <div class="menu" id="menu">

        <div class="menuTitle">
            ✦ JUNSOO'S MENU ✦
        </div>

        <button onclick="toggleGameMode()">
            🎮 게임 모드 ON / OFF
        </button>

        <button onclick="addCoins(10)">
            🪙 코인 +10
        </button>

        <button onclick="randomEvent()">
            🎲 랜덤 이벤트
        </button>

        <button onclick="openShop()">
            🛒 코인 상점
        </button>

        <button onclick="openGacha()">
            🎁 랜덤 뽑기
        </button>

        <label>
            🖼️ 이미지 추가
            <input
                type="file"
                id="imageInput"
                accept="image/*"
                onchange="addImage(event)"
            >
        </label>

        <button onclick="clearImages()">
            🗑️ 이미지 전부 삭제
        </button>

        <button onclick="zoomSite(0.1)">
            🔍 사이트 확대
        </button>

        <button onclick="zoomSite(-0.1)">
            🔎 사이트 축소
        </button>

        <button onclick="resetZoom()">
            ↩️ 확대 초기화
        </button>

        <button onclick="activateSecret()">
            ❓ 비밀 기능
        </button>

    </div>


    <!-- HEADER -->
    <header class="header">

        <h1>
            준수가 한국으로 돌아가기까지...
        </h1>

        <p>
            ✦ just a little corner of the internet ✦
        </p>

    </header>


    <!-- COUNTDOWN -->
    <main class="countdown">

        <div class="targetBox">

            <input
                type="datetime-local"
                id="targetDate"
            >

        </div>


        <div class="units">

            <div class="unit" id="yearBox">
                <div class="number" id="years">
                    0.0
                </div>
                <div class="label">
                    년
                </div>
            </div>


            <div class="unit" id="monthBox">
                <div class="number" id="months">
                    0.0
                </div>
                <div class="label">
                    달
                </div>
            </div>


            <div class="unit" id="weekBox">
                <div class="number" id="weeks">
                    0.0
                </div>
                <div class="label">
                    주
                </div>
            </div>


            <div class="unit" id="dayBox">
                <div class="number" id="days">
                    0.0
                </div>
                <div class="label">
                    일
                </div>
            </div>


            <div class="unit" id="hourBox">
                <div class="number" id="hours">
                    0.0
                </div>
                <div class="label">
                    시간
                </div>
            </div>


            <div class="unit" id="minuteBox">
                <div class="number" id="minutes">
                    0.0
                </div>
                <div class="label">
                    분
                </div>
            </div>


            <div class="unit" id="secondBox">
                <div class="number" id="seconds">
                    0.0
                </div>
                <div class="label">
                    초
                </div>
            </div>

        </div>

    </main>


    <!-- IMAGE BOARD -->
    <div id="board"></div>


    <!-- SHRIMP PET -->
    <div id="pet">
        🦐
    </div>


    <!-- EVENT -->
    <div id="eventText"></div>


    <!-- SHOP -->
    <div class="shop" id="shop">

        <h2>
            🛒 RIPPLE SHOP
        </h2>

        <div class="shopItem">
            🦐 새우 속도 UP
            <br>
            <small>가격: 50 코인</small>
            <br><br>
            <button onclick="buySpeed()">
                구매
            </button>
        </div>

        <div class="shopItem">
            ✨ 화면 반짝임
            <br>
            <small>가격: 80 코인</small>
            <br><br>
            <button onclick="buySparkle()">
                구매
            </button>
        </div>

        <div class="shopItem">
            🎨 랜덤 배경
            <br>
            <small>가격: 100 코인</small>
            <br><br>
            <button onclick="buyBackground()">
                구매
            </button>
        </div>

        <div class="shopItem">
            🦐 새우 친구 추가
            <br>
            <small>가격: 150 코인</small>
            <br><br>
            <button onclick="buyShrimp()">
                구매
            </button>
        </div>

        <button onclick="closeShop()">
            닫기
        </button>

    </div>


    <!-- SECRET -->
    <div id="secret">

        <div class="secretBox">

            <div>
                🌌 SECRET MODE 🌌
            </div>

            <p>
                여기까지 찾아왔네?
            </p>

            <p>
                오늘의 비밀 보상 +100 코인!
            </p>

            <button onclick="closeSecret()">
                돌아가기
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================
   COUNTDOWN
========================================= */

const targetInput = document.getElementById("targetDate");

let savedTarget = localStorage.getItem("targetDate");

if(savedTarget) {
    targetInput.value = savedTarget;
}

targetInput.addEventListener("change", () => {

    localStorage.setItem(
        "targetDate",
        targetInput.value
    );

    updateCountdown();

});


function updateCountdown() {

    if(!targetInput.value) return;

    const target =
        new Date(targetInput.value).getTime();

    const now =
        Date.now();

    let diff =
        Math.max(0,target-now);


    const second =
        1000;

    const minute =
        second * 60;

    const hour =
        minute * 60;

    const day =
        hour * 24;

    const week =
        day * 7;

    const year =
        day * 365.2425;

    const month =
        year / 12;


    const years =
        diff / year;

    const months =
        diff / month;

    const weeks =
        diff / week;

    const days =
        diff / day;

    const hours =
        diff / hour;

    const minutes =
        diff / minute;

    const seconds =
        diff / second;


    document.getElementById("years").textContent =
        years.toFixed(1);

    document.getElementById("months").textContent =
        months.toFixed(1);

    document.getElementById("weeks").textContent =
        weeks.toFixed(1);

    document.getElementById("days").textContent =
        days.toFixed(1);

    document.getElementById("hours").textContent =
        hours.toFixed(1);

    document.getElementById("minutes").textContent =
        minutes.toFixed(1);

    document.getElementById("seconds").textContent =
        seconds.toFixed(1);


    changeColors(years);
}


setInterval(updateCountdown,100);

updateCountdown();


/* =========================================
   COLOR TRANSITION
========================================= */

function changeColors(years) {

    const boxes =
        document.querySelectorAll(".unit");

    let hue =
        (years * 35) % 360;

    boxes.forEach((box,index) => {

        const h =
            (hue + index * 35) % 360;

        box.style.background =
            `hsla(${h},80%,92%,.58)`;

    });
}


/* =========================================
   MENU
========================================= */

function toggleMenu() {

    document
        .getElementById("menu")
        .classList.toggle("open");

}


/* =========================================
   GAME MODE
========================================= */

let gameMode =
    localStorage.getItem("gameMode") === "true";


if(gameMode) {

    document.body.classList.add("gameMode");

}


function toggleGameMode() {

    gameMode =
        !gameMode;

    document.body.classList.toggle(
        "gameMode",
        gameMode
    );

    localStorage.setItem(
        "gameMode",
        gameMode
    );


    showEvent(
        gameMode
        ? "🎮 GAME MODE ON!"
        : "🌿 게임 모드 OFF"
    );

}


/* =========================================
   COINS
========================================= */

let coins =
    Number(
        localStorage.getItem("coins") || 0
    );


function updateCoins() {

    document.getElementById(
        "coinAmount"
    ).textContent = coins;

    localStorage.setItem(
        "coins",
        coins
    );

}


function addCoins(amount) {

    coins += amount;

    updateCoins();

    showEvent(
        `🪙 +${amount} COIN!`
    );

}


updateCoins();


/* =========================================
   SHRIMP PET
========================================= */

const pet =
    document.getElementById("pet");

let petX =
    Math.random() * (window.innerWidth - 100);

let petY =
    Math.random() * (window.innerHeight - 100);

let petVX =
    (Math.random() > .5 ? 1 : -1) * 1.2;

let petVY =
    (Math.random() > .5 ? 1 : -1) * 1.0;

let petSpeed =
    Number(
        localStorage.getItem("petSpeed") || 1
    );


function movePet() {

    if(!gameMode) return;


    petX += petVX * petSpeed;

    petY += petVY * petSpeed;


    if(
        petX < 0 ||
        petX > window.innerWidth - 90
    ) {

        petVX *= -1;

    }


    if(
        petY < 0 ||
        petY > window.innerHeight - 90
    ) {

        petVY *= -1;

    }


    pet.style.left =
        petX + "px";

    pet.style.top =
        petY + "px";


    requestAnimationFrame(movePet);

}


movePet();


/* =========================================
   GACHA
========================================= */

function openGacha() {

    if(!gameMode) {

        showEvent(
            "🎮 먼저 게임 모드를 켜줘!"
        );

        return;

    }


    const cost = 20;

    if(coins < cost) {

        showEvent(
            "🪙 코인이 부족해!"
        );

        return;

    }


    coins -= cost;

    updateCoins();


    const rewards = [

        {
            name:"꽝",
            amount:0,
            weight:25
        },

        {
            name:"작은 보상",
            amount:10,
            weight:25
        },

        {
            name:"코인 상자",
            amount:30,
            weight:20
        },

        {
            name:"럭키 코인",
            amount:70,
            weight:15
        },

        {
            name:"대박!",
            amount:150,
            weight:10
        },

        {
            name:"LEGENDARY",
            amount:500,
            weight:5
        }

    ];


    let total =
        rewards.reduce(
            (a,b)=>a+b.weight,
            0
        );


    let random =
        Math.random() * total;


    let selected;


    for(const reward of rewards) {

        random -= reward.weight;

        if(random <= 0) {

            selected =
                reward;

            break;

        }

    }


    coins += selected.amount;

    updateCoins();


    showEvent(
        `🎁 ${selected.name}! +${selected.amount} COIN`
    );

}


/* =========================================
   RANDOM EVENTS
========================================= */

let eventCooldown = false;


function randomEvent() {

    if(!gameMode) {

        showEvent(
            "🎮 게임 모드를 먼저 켜줘!"
        );

        return;

    }


    if(eventCooldown) {

        showEvent(
            "⏳ 잠깐만..."
        );

        return;

    }


    eventCooldown = true;


    setTimeout(() => {
        eventCooldown = false;
    },1500);


    const events = [

        {
            weight:25,
            action:() => {
                addCoins(5);
                showEvent("🍀 작은 행운! +5");
            }
        },

        {
            weight:18,
            action:() => {
                addCoins(20);
                showEvent("✨ 반짝이는 코인을 발견했다! +20");
            }
        },

        {
            weight:12,
            action:() => {
                addCoins(50);
                showEvent("💰 코인 폭탄! +50");
            }
        },

        {
            weight:10,
            action:() => {
                inkEvent();
            }
        },

        {
            weight:10,
            action:() => {
                document.body.style.transform =
                    "rotate(2deg)";

                setTimeout(()=>{
                    document.body.style.transform =
                        "";
                },500);

                showEvent("🌪️ 사이트가 흔들렸다!");
            }
        },

        {
            weight:8,
            action:() => {
                document.body.style.filter =
                    "hue-rotate(120deg)";

                setTimeout(()=>{
                    document.body.style.filter =
                        "";
                },2500);

                showEvent("🌈 세상의 색이 바뀌었다!");
            }
        },

        {
            weight:7,
            action:() => {

                petVX *= 3;
                petVY *= 3;

                setTimeout(()=>{
                    petVX /= 3;
                    petVY /= 3;
                },3000);

                showEvent("🦐 새우가 폭주했다!!!");

            }
        },

        {
            weight:5,
            action:() => {

                coins += 100;

                updateCoins();

                showEvent(
                    "🎉 SUPER LUCKY! +100"
                );

            }
        },

        {
            weight:3,
            action:() => {

                document.body.style.filter =
                    "invert(1)";

                setTimeout(()=>{
                    document.body.style.filter =
                        "";
                },1000);

                showEvent(
                    "🌀 잠깐 다른 차원에 다녀왔습니다."
                );

            }
        },

        {
            weight:2,
            action:() => {

                activateSecret();

            }
        }

    ];


    let total =
        events.reduce(
            (sum,event)=>sum+event.weight,
            0
        );


    let random =
        Math.random() * total;


    for(const event of events) {

        random -= event.weight;

        if(random <= 0) {

            event.action();

            break;

        }

    }

}

function buyShrimp() {

    moveNewPet();


    showEvent(

/* =========================================
   IMAGE SYSTEM
========================================= */

function addImage(event) {

    const file =
        event.target.files[0];

    if(!file) return;


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            const img =
                document.createElement("img");

            img.src =
                e.target.result;

            img.className =
                "boardImage";


            img.style.left =
                "50%";

            img.style.top =
                "50%";


            document
                .getElementById("board")
                .appendChild(img);


            makeDraggable(img);

            saveImages();

        };


    reader.readAsDataURL(file);

}


function makeDraggable(element) {

    let dragging =
        false;

    let offsetX = 0;
    let offsetY = 0;


    element.addEventListener(
        "mousedown",
        e => {

            dragging = true;

            offsetX =
                e.clientX -
                element.getBoundingClientRect().left;

            offsetY =
                e.clientY -
                element.getBoundingClientRect().top;

        }
    );


    window.addEventListener(
        "mousemove",
        e => {

            if(!dragging) return;


            element.style.left =
                (e.clientX-offsetX)+"px";

            element.style.top =
                (e.clientY-offsetY)+"px";

        }
    );


    window.addEventListener(
        "mouseup",
        () => {

            dragging = false;

            saveImages();

        }
    );

}


function saveImages() {

    const images =
        [...document.querySelectorAll(".boardImage")];

    const data =
        images.map(img => ({

            src:img.src,

            left:img.style.left,

            top:img.style.top

        }));


    localStorage.setItem(
        "boardImages",
        JSON.stringify(data)
    );

}


function loadImages() {

    const data =
        JSON.parse(
            localStorage.getItem(
                "boardImages"
            ) || "[]"
        );


    data.forEach(item => {

        const img =
            document.createElement("img");

        img.src =
            item.src;

        img.className =
            "boardImage";

        img.style.left =
            item.left;

        img.style.top =
            item.top;


        document
            .getElementById("board")
            .appendChild(img);


        makeDraggable(img);

    });

}


function clearImages() {

    document
        .getElementById("board")
        .innerHTML = "";


    localStorage.removeItem(
        "boardImages"
    );

}


loadImages();


/* =========================================
   SITE ZOOM
========================================= */

let siteZoom =
    Number(
        localStorage.getItem(
            "siteZoom"
        ) || 1
    );


function applyZoom() {

    document.body.style.zoom =
        siteZoom;

}


function zoomSite(amount) {

    siteZoom += amount;


    siteZoom =
        Math.max(
            .5,
            Math.min(
                2,
                siteZoom
            )
        );


    localStorage.setItem(
        "siteZoom",
        siteZoom
    );


    applyZoom();

}


function resetZoom() {

    siteZoom = 1;

    localStorage.setItem(
        "siteZoom",
        siteZoom
    );

    applyZoom();

}


applyZoom();
