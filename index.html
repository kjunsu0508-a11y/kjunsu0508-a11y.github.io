<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Junsoo's Space</title>

<style>

/* =========================================================
   FONT
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Jua&family=Press+Start+2P&display=swap');


/* =========================================================
   BASIC
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {

    font-family: 'Jua', sans-serif;

    color: #29233a;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(255,255,255,.95),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            #e4f7ff,
            #f7e8ff,
            #fff4d9
        );

    overflow-x: hidden;

    transition:
        background 1s ease,
        filter .5s ease,
        transform .3s ease;
}


/* =========================================================
   APP
========================================================= */

#app {

    width: 100%;
    min-height: 100vh;

    position: relative;

    overflow: hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    text-align: center;

    padding-top: 65px;
    padding-left: 80px;
    padding-right: 80px;

    position: relative;

    z-index: 10;
}

.header h1 {

    margin: 0;

    font-size:
        clamp(42px, 7vw, 92px);

    line-height: 1.05;

    letter-spacing: -4px;

    color: #3d3159;

    text-shadow:
        4px 4px 0 rgba(255,255,255,.85),
        8px 8px 0 rgba(100,80,140,.10);
}

.header p {

    margin-top: 15px;

    font-size: 19px;

    opacity: .55;
}


/* =========================================================
   COUNTDOWN AREA
========================================================= */

.countdown {

    min-height: calc(100vh - 160px);

    padding:
        45px
        25px
        100px;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* =========================================================
   DATE INPUT
========================================================= */

.targetBox {

    margin-bottom: 40px;

    text-align: center;
}

.targetBox input {

    border: none;

    outline: none;

    padding:
        13px
        18px;

    border-radius: 20px;

    background:
        rgba(255,255,255,.75);

    box-shadow:
        0 7px 25px rgba(0,0,0,.07);

    font-family: inherit;

    font-size: 16px;

    color: #40384e;
}


/* =========================================================
   COUNTDOWN GRID
========================================================= */

.units {

    width:
        min(1250px, 95vw);

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px, 1fr)
        );

    gap: 18px;
}


/* =========================================================
   UNIT
========================================================= */

.unit {

    min-height: 190px;

    padding:
        25px
        12px;

    border-radius: 35px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    background:
        rgba(255,255,255,.55);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 15px 40px rgba(0,0,0,.08),
        inset 0 1px 0
        rgba(255,255,255,.85);

    transition:
        transform .3s ease,
        background 1s ease;
}

.unit:hover {

    transform:
        translateY(-7px)
        rotate(-1deg);
}


/* =========================================================
   NUMBERS
========================================================= */

.number {

    font-family:
        'Press Start 2P',
        monospace;

    font-size:
        clamp(
            25px,
            4vw,
            53px
        );

    line-height: 1.25;

    text-align: center;

    overflow-wrap:
        anywhere;
}


/* =========================================================
   LABEL
========================================================= */

.label {

    margin-top: 18px;

    font-size: 22px;

    opacity: .65;
}


/* =========================================================
   MENU BUTTON
========================================================= */

.menuButton {

    position: fixed;

    right: 22px;
    top: 22px;

    width: 62px;
    height: 62px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255,255,255,.88);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.13);

    font-size: 28px;

    cursor: pointer;

    z-index: 5000;

    transition:
        transform .2s ease;
}

.menuButton:hover {

    transform:
        scale(1.08)
        rotate(5deg);
}


/* =========================================================
   SIDE MENU
========================================================= */

.menu {

    position: fixed;

    right: 22px;
    top: 95px;

    width: 290px;

    max-height:
        calc(100vh - 115px);

    overflow-y: auto;

    padding: 20px;

    background:
        rgba(255,255,255,.94);

    backdrop-filter:
        blur(20px);

    border-radius: 28px;

    box-shadow:
        0 20px 70px
        rgba(0,0,0,.18);

    z-index: 4900;

    transform:
        translateX(130%);

    transition:
        transform .35s ease;
}

.menu.open {

    transform:
        translateX(0);
}


.menuTitle {

    text-align: center;

    font-size: 24px;

    margin-bottom: 18px;
}


.menu button,
.menu label {

    width: 100%;

    display: block;

    padding: 13px;

    margin-bottom: 9px;

    border: none;

    border-radius: 15px;

    background:
        #f1edff;

    color:
        #332b43;

    font-family: inherit;

    font-size: 16px;

    text-align: center;

    cursor: pointer;

    transition:
        background .2s,
        transform .2s;
}

.menu button:hover,
.menu label:hover {

    background:
        #ded5ff;

    transform:
        translateY(-2px);
}


/* =========================================================
   GAME MODE PANEL
========================================================= */

.gamePanel {

    display: none;

    position: fixed;

    left: 22px;
    top: 22px;

    min-width: 190px;

    padding: 15px 18px;

    border-radius: 22px;

    background:
        rgba(255,255,255,.90);

    backdrop-filter:
        blur(15px);

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.12);

    z-index: 3000;
}

body.game-mode .gamePanel {

    display: block;
}


.coinTitle {

    font-family:
        'Press Start 2P',
        monospace;

    font-size: 12px;
}

.coinAmount {

    margin-top: 9px;

    font-size: 26px;

    text-align: center;
}


/* =========================================================
   GAME MINI BUTTONS
========================================================= */

.gameButtons {

    display: flex;

    gap: 5px;

    margin-top: 12px;
}

.gameButtons button {

    flex: 1;

    border: none;

    border-radius: 11px;

    padding: 8px 4px;

    font-family: inherit;

    cursor: pointer;

    background: #eee8ff;
}


/* =========================================================
   SHRIMP
========================================================= */

#shrimp {

    display: none;

    position: fixed;

    width: 75px;
    height: 75px;

    font-size: 67px;

    z-index: 2500;

    pointer-events: none;

    user-select: none;

    filter:
        drop-shadow(
            0 7px 7px
            rgba(0,0,0,.16)
        );
}

body.game-mode #shrimp {

    display: block;
}


/* =========================================================
   MISSION PANEL
========================================================= */

.modal {

    position: fixed;

    left: 50%;
    top: 50%;

    width:
        min(450px, 90vw);

    max-height: 82vh;

    overflow-y: auto;

    padding: 25px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.97);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.25);

    z-index: 7000;

    transform:
        translate(-50%,-50%)
        scale(.85);

    opacity: 0;

    pointer-events: none;

    transition:
        .3s ease;
}

.modal.active {

    transform:
        translate(-50%,-50%)
        scale(1);

    opacity: 1;

    pointer-events: auto;
}


.modal h2 {

    text-align: center;

    margin-top: 0;
}


/* =========================================================
   MISSION
========================================================= */

.mission {

    padding: 15px;

    margin:
        10px
        0;

    border-radius: 18px;

    background:
        #f3efff;
}

.mission.completed {

    opacity: .55;

    background:
        #e2f8e8;
}

.missionTitle {

    font-size: 18px;
}

.missionReward {

    margin-top: 5px;

    opacity: .7;
}

.missionStatus {

    margin-top: 8px;

    font-size: 14px;
}


/* =========================================================
   MODAL BUTTON
========================================================= */

.closeButton {

    width: 100%;

    padding: 11px;

    margin-top: 12px;

    border: none;

    border-radius: 14px;

    background:
        #e8e0ff;

    font-family: inherit;

    cursor: pointer;
}


/* =========================================================
   SHOP
========================================================= */

.shopItem {

    padding: 15px;

    margin:
        10px
        0;

    border-radius: 18px;

    background:
        #f4efff;
}

.shopItem button {

    border: none;

    border-radius: 10px;

    padding:
        8px
        15px;

    margin-top: 8px;

    font-family: inherit;

    cursor: pointer;
}


/* =========================================================
   EVENT MESSAGE
========================================================= */

#eventText {

    position: fixed;

    left: 50%;
    top: 18%;

    transform:
        translate(-50%,-50%)
        scale(.7);

    padding:
        18px
        28px;

    border-radius: 28px;

    background:
        rgba(255,255,255,.96);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.18);

    font-size: 25px;

    text-align: center;

    z-index: 8000;

    opacity: 0;

    pointer-events: none;

    transition:
        .35s ease;
}

#eventText.show {

    opacity: 1;

    transform:
        translate(-50%,-50%)
        scale(1);
}


/* =========================================================
   INK
========================================================= */

.ink {

    position: fixed;

    border-radius: 50%;

    background:
        #3b287d;

    z-index: 6000;

    pointer-events: none;

    animation:
        inkAnimation 1.5s forwards;
}

@keyframes inkAnimation {

    0% {

        transform:
            scale(.1);

        opacity: 0;
    }

    20% {

        opacity: .9;
    }

    100% {

        transform:
            scale(2);

        opacity: 0;
    }
}


/* =========================================================
   IMAGE BOARD
========================================================= */

#board {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 200;
}

.boardImage {

    position: absolute;

    max-width: 260px;
    max-height: 260px;

    pointer-events: auto;

    cursor: move;

    user-select: none;

    filter:
        drop-shadow(
            0 10px 15px
            rgba(0,0,0,.18)
        );
}


/* =========================================================
   SECRET
========================================================= */

#secret {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(20,15,35,.92);

    z-index: 10000;

    color: white;

    opacity: 0;

    pointer-events: none;

    transition:
        .4s;
}

#secret.active {

    opacity: 1;

    pointer-events: auto;
}

.secretBox {

    text-align: center;

    font-size: 28px;

    padding: 40px;
}

.secretBox button {

    margin-top: 20px;

    padding:
        12px
        25px;

    border: none;

    border-radius: 20px;

    font-family: inherit;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px) {

    .header {

        padding-top: 90px;

        padding-left: 20px;
        padding-right: 20px;
    }

    .header h1 {

        font-size:
            clamp(
                35px,
                11vw,
                60px
            );

        letter-spacing:
            -2px;
    }

    .header p {

        font-size: 15px;
    }

    .countdown {

        padding-top: 30px;
    }

    .units {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;
    }

    .unit {

        min-height: 145px;

        border-radius: 25px;
    }

    .number {

        font-size:
            clamp(
                17px,
                5vw,
                30px
            );
    }

    .label {

        font-size: 17px;
    }

    .gamePanel {

        left: 10px;
        top: 10px;

        min-width: 145px;
    }

    .menuButton {

        right: 10px;
        top: 10px;
    }

    .menu {

        right: 10px;
    }
}

</style>
</head>

<script>

/* =========================================================
   STORAGE
========================================================= */

const storage = {

    get(key, fallback) {

        const value =
            localStorage.getItem(key);

        if(value === null)
            return fallback;

        try {

            return JSON.parse(value);

        } catch {

            return value;

        }

    },

    set(key,value) {

        localStorage.setItem(
            key,
            JSON.stringify(value)
        );

    }

};


/* =========================================================
   COUNTDOWN
========================================================= */

const targetInput =
    document.getElementById(
        "targetDate"
    );


const savedTarget =
    localStorage.getItem(
        "targetDate"
    );


if(savedTarget) {

    targetInput.value =
        savedTarget;

}


targetInput.addEventListener(
    "change",
    () => {

        localStorage.setItem(
            "targetDate",
            targetInput.value
        );

        updateCountdown();

    }
);


function updateCountdown() {

    if(!targetInput.value)
        return;


    const target =
        new Date(
            targetInput.value
        ).getTime();


    const now =
        Date.now();


    let diff =
        Math.max(
            0,
            target - now
        );


    const second = 1000;

    const minute =
        second * 60;

    const hour =
        minute * 60;

    const day =
        hour * 24;

    const week =
        day * 7;

    const year =
        day * 365.2425;

    const month =
        year / 12;


    document.getElementById(
        "years"
    ).textContent =
        (diff/year).toFixed(1);


    document.getElementById(
        "months"
    ).textContent =
        (diff/month).toFixed(1);


    document.getElementById(
        "weeks"
    ).textContent =
        (diff/week).toFixed(1);


    document.getElementById(
        "days"
    ).textContent =
        (diff/day).toFixed(1);


    document.getElementById(
        "hours"
    ).textContent =
        (diff/hour).toFixed(1);


    document.getElementById(
        "minutes"
    ).textContent =
        (diff/minute).toFixed(1);


    document.getElementById(
        "seconds"
    ).textContent =
        (diff/second).toFixed(1);


    updateCountdownColors(
        diff / year
    );

}


function updateCountdownColors(years) {

    const boxes =
        document.querySelectorAll(
            ".unit"
        );


    const base =
        (years * 35) % 360;


    boxes.forEach(
        (box,index) => {

            const hue =
                (base + index*35) % 360;

            box.style.background =
                `hsla(
                    ${hue},
                    80%,
                    92%,
                    .58
                )`;

        }
    );

}


setInterval(
    updateCountdown,
    100
);

updateCountdown();


/* =========================================================
   MENU
========================================================= */

function toggleMenu() {

    document
        .getElementById("menu")
        .classList.toggle("open");

}


/* =========================================================
   GAME STATE
========================================================= */

let gameMode =
    storage.get(
        "gameMode",
        false
    );

/* =========================================================

========================================================= */

function addImage(event) {

    const file =
        event.target.files[0];


    if(!file)
        return;


    const reader =
        new FileReader();


    reader.onload =
        e => {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                e.target.result;


            img.className =
                "boardImage";


            img.style.left =
                "50%";


            img.style.top =
                "50%";


            document
                .getElementById(
                    "board"
                )
                .appendChild(
                    img
                );


            makeDraggable(
                img
            );


            saveImages();

        };


    reader.readAsDataURL(
        file
    );

}


function makeDraggable(
    element
) {

    let dragging =
        false;


    let offsetX = 0;
    let offsetY = 0;


    element.addEventListener(
        "mousedown",
        e => {

            dragging =
                true;


            const rect =
                element.getBoundingClientRect();


            offsetX =
                e.clientX -
                rect.left;


            offsetY =
                e.clientY -
                rect.top;

        }
    );


    window.addEventListener(
        "mousemove",
        e => {

            if(!dragging)
                return;


            element.style.left =
                (
                    e.clientX -
                    offsetX
                )+"px";


            element.style.top =
                (
                    e.clientY -
                    offsetY
                )+"px";

        }
    );


    window.addEventListener(
        "mouseup",
        () => {

            dragging =
                false;


            saveImages();

        }
    );

}


function saveImages() {

    const images =
        [
            ...document.querySelectorAll(
                ".boardImage"
            )
        ];


    const data =
        images.map(
            img => ({

                src:
                    img.src,

                left:
                    img.style.left,

                top:
                    img.style.top

            })
        );


    storage.set(
        "boardImages",
        data
    );

}


function loadImages() {

    const data =
        storage.get(
            "boardImages",
            []
        );


    data.forEach(
        item => {

            const img =
                document.createElement(
                    "img"
                );


            img.src =
                item.src;


            img.className =
                "boardImage";


            img.style.left =
                item.left;


            img.style.top =
                item.top;


            document
                .getElementById(
                    "board"
                )
                .appendChild(
                    img
                );


            makeDraggable(
                img
            );

        }
    );

}


function clearImages() {

        )

    localStorage.removeItem(

    );

}
