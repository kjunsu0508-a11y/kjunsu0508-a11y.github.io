<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>준수가 한국으로 돌아가기까지...</title>

<!-- 레트로 느낌 폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>

/* =========================
   기본
========================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #111;
    color: white;

    font-family:
        "Fredoka",
        "Gowun Dodum",
        sans-serif;

    overflow-x: hidden;
}


/* =========================
   카운트다운 화면
========================= */

.time-section {
    width: 100%;
    height: 100vh;
    height: 100svh;

    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    position: relative;

    overflow: hidden;

    padding: 30px 20px;
}


/* =========================
   제목
========================= */

.page-title {
    position: absolute;

    top: 8vh;

    left: 20px;
    right: 20px;

    font-size:
        clamp(38px, 6vw, 80px);

    font-weight: 700;

    line-height: 1.1;

    letter-spacing: -2px;

    text-shadow:
        3px 4px 0 rgba(0,0,0,.18);

    z-index: 10;
}


/* =========================
   단위
========================= */

.unit {
    font-size:
        clamp(17px, 2.5vw, 29px);

    font-weight: 600;

    letter-spacing: 8px;

    margin-bottom: 20px;

    color:
        rgba(255,255,255,.65);
}


/* =========================
   숫자
========================= */

.number {
    width: 100%;

    padding: 0 10px;

    font-size:
        clamp(50px, 12vw, 160px);

    font-weight: 700;

    line-height: 1;

    letter-spacing: -3px;

    font-variant-numeric:
        tabular-nums;

    white-space: nowrap;

    overflow: hidden;

    text-shadow:
        4px 7px 0 rgba(0,0,0,.18);
}


/* =========================
   설명
========================= */

.description {
    margin-top: 25px;

    font-size:
        clamp(17px, 2.5vw, 27px);

    font-weight: 500;

    color:
        rgba(255,255,255,.65);
}


/* =========================
   배경 색상
========================= */

.years {
    background:
        linear-gradient(
            180deg,
            #172b48,
            #29425e
        );
}

.months {
    background:
        linear-gradient(
            180deg,
            #29425e,
            #443e68
        );
}

.weeks {
    background:
        linear-gradient(
            180deg,
            #443e68,
            #59466a
        );
}

.days {
    background:
        linear-gradient(
            180deg,
            #59466a,
            #6d514d
        );
}

.hours {
    background:
        linear-gradient(
            180deg,
            #6d514d,
            #78513c
        );
}

.minutes {
    background:
        linear-gradient(
            180deg,
            #78513c,
            #52694f
        );
}

.seconds {
    background:
        linear-gradient(
            180deg,
            #52694f,
            #263f40
        );
}


/* =================================================
   🎈 풍선 영역
================================================= */

#balloon-area {
    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 500;
}


/* =================================================
   🎈 실제 풍선
================================================= */

.balloon-wrapper {

    position: absolute;

    width: 130px;
    height: 180px;

    pointer-events: auto;

    cursor: pointer;

    user-select: none;
}


/* 풍선 본체 */

.balloon {

    position: absolute;

    left: 10px;
    top: 0;

    width: 105px;
    height: 125px;

    border-radius:
        50% 50% 48% 48%;

    transform:
        rotate(-4deg);

    box-shadow:

        inset
        -13px
        -15px
        20px
        rgba(0,0,0,.13),

        inset
        12px
        10px
        12px
        rgba(255,255,255,.35),

        4px
        7px
        0
        rgba(0,0,0,.15);

    transition:
        transform .2s;
}


/* 풍선 아래쪽 */

.balloon::after {

    content: "";

    position: absolute;

    left: 43px;

    bottom: -10px;

    width: 18px;
    height: 18px;

    background: inherit;

    transform:
        rotate(45deg);
}


/* 풍선 하이라이트 */

.balloon::before {

    content: "";

    position: absolute;

    width: 25px;
    height: 38px;

    left: 18px;
    top: 17px;

    background:
        rgba(255,255,255,.38);

    border-radius: 50%;

    transform:
        rotate(25deg);
}


/* 풍선 내용 */

.balloon-text {

    position: absolute;

    left: 15px;
    right: 15px;

    top: 43px;

    text-align: center;

    color: white;

    font-family:
        "Gowun Dodum",
        sans-serif;

    font-size: 13px;

    line-height: 1.3;

    font-weight: bold;

    z-index: 2;

    overflow: hidden;

    display: -webkit-box;

    -webkit-line-clamp: 3;

    -webkit-box-orient: vertical;

    text-shadow:
        1px 1px 2px rgba(0,0,0,.25);
}


/* 풍선 끈 */

.balloon-string {

    position: absolute;

    left: 62px;

    top: 132px;

    width: 2px;

    height: 47px;

    background:
        rgba(255,255,255,.75);

    transform:
        rotate(3deg);

    transform-origin: top;
}


/* 작은 매듭 */

.balloon-knot {

    position: absolute;

    left: 53px;

    top: 117px;

    width: 18px;
    height: 18px;

    background: inherit;

    transform:
        rotate(45deg);

    z-index: 1;
}


/* =================================================
   풍선 색상
================================================= */

.balloon.red {
    background:
        linear-gradient(
            135deg,
            #ff7c8c,
            #d94763
        );
}

.balloon.blue {
    background:
        linear-gradient(
            135deg,
            #75c9ff,
            #4786d9
        );
}

.balloon.yellow {
    background:
        linear-gradient(
            135deg,
            #ffe77b,
            #e8b832
        );
}

.balloon.purple {
    background:
        linear-gradient(
            135deg,
            #c99cff,
            #8961c9
        );
}

.balloon.green {
    background:
        linear-gradient(
            135deg,
            #82dfa2,
            #43a96d
        );
}


/* =================================================
   📔 일기 버튼
================================================= */

.diary-button {

    position: fixed;

    right: 22px;
    bottom: 22px;

    width: 65px;
    height: 65px;

    border:

        3px solid
        #4e3927;

    border-radius: 12px;

    background:
        #f4d58d;

    color:
        #4e3927;

    font-size: 28px;

    cursor: pointer;

    z-index: 9000;

    box-shadow:
        4px 5px 0 #38291d;

    transition:
        .2s;
}


.diary-button:hover {

    transform:
        translateY(-3px)
        rotate(-3deg);

    box-shadow:
        6px 7px 0 #38291d;
}


/* =================================================
   📔 일기 패널
================================================= */

.diary-panel {

    position: fixed;

    right: 25px;
    bottom: 100px;

    width:
        min(
            390px,
            calc(100vw - 40px)
        );

    background:
        #fff4c9;

    color:
        #493827;

    border:
        4px solid
        #5b402b;

    border-radius:
        8px;

    padding:
        22px;

    z-index: 8999;

    box-shadow:
        8px 9px 0
        rgba(0,0,0,.35);

    opacity: 0;

    transform:
        translateY(20px)
        scale(.95);

    pointer-events: none;

    transition:
        .2s;
}


.diary-panel.open {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events: auto;
}


/* 패널 상단 */

.diary-header {

    display: flex;

    justify-content:
        space-between;

    align-items: center;

    border-bottom:
        2px dashed
        #b49a68;

    padding-bottom:
        12px;

    margin-bottom:
        15px;
}


.diary-header h2 {

    margin: 0;

    font-size: 23px;
}


.close-button {

    border: none;

    background: transparent;

    color: #493827;

    font-size: 25px;

    cursor: pointer;
}


/* 입력 */

.diary-label {

    display: block;

    margin-top: 12px;

    margin-bottom: 5px;

    font-size: 14px;

    font-weight: bold;
}


.diary-input,
.diary-textarea {

    width: 100%;

    border:
        2px solid
        #bba477;

    border-radius:
        5px;

    padding:
        10px;

    background:
        #fffbea;

    color:
        #493827;

    font-family:
        "Gowun Dodum",
        sans-serif;

    font-size:
        15px;

    outline: none;
}


.diary-textarea {

    height: 125px;

    resize: none;
}


/* 저장 */

.save-diary {

    width: 100%;

    margin-top: 15px;

    padding: 11px;

    border:
        3px solid
        #4e3927;

    border-radius:
        5px;

    background:
        #dfb967;

    color:
        #4e3927;

    font-family:
        "Fredoka",
        sans-serif;

    font-size:
        16px;

    font-weight:
        600;

    cursor:
        pointer;

    box-shadow:
        3px 3px 0
        #4e3927;
}


.save-diary:active {

    transform:
        translate(
            2px,
            2px
        );

    box-shadow:
        1px 1px 0
        #4e3927;
}


/* =================================================
   📜 풍선 클릭 창
================================================= */

.diary-view {

    position: fixed;

    left: 50%;
    top: 50%;

    width:
        min(
            430px,
            calc(100vw - 40px)
        );

    background:
        #fff4c9;

    color:
        #493827;

    border:
        4px solid
        #5b402b;

    border-radius:
        8px;

    padding:
        25px;

    z-index:
        10000;

    box-shadow:
        9px 10px 0
        rgba(0,0,0,.4);

    opacity: 0;

    pointer-events: none;

    transform:
        translate(-50%,-50%)
        scale(.9);

    transition:
        .2s;
}


.diary-view.show {

    opacity: 1;

    pointer-events: auto;

    transform:
        translate(-50%,-50%)
        scale(1);
}


.diary-view-date {

    font-size:
        14px;

    color:
        #927957;

    margin-bottom:
        12px;

    border-bottom:
        2px dashed
        #b49a68;

    padding-bottom:
        8px;
}


.diary-view-text {

    font-family:
        "Gowun Dodum",
        sans-serif;

    white-space:
        pre-wrap;

    line-height:
        1.7;

    min-height:
        80px;

    word-break:
        break-word;
}


/* 삭제 버튼 */

.delete-diary {

    width: 48%;

    padding: 10px;

    margin-top: 20px;

    border:
        3px solid
        #7b3131;

    background:
        #ef9999;

    color:
        #572020;

    border-radius:
        5px;

    font-family:
        "Fredoka",
        sans-serif;

    font-weight:
        600;

    cursor:
        pointer;
}


/* 닫기 버튼 */

.close-view {

    width: 48%;

    padding: 10px;

    margin-top: 20px;

    border:
        3px solid
        #4e3927;

    background:
        #dfb967;

    color:
        #4e3927;

    border-radius:
        5px;

    font-family:
        "Fredoka",
        sans-serif;

    font-weight:
        600;

    cursor:
        pointer;
}


.view-buttons {

    display: flex;

    justify-content:
        space-between;

    gap: 10px;
}


/* =================================================
   모바일
================================================= */

@media (max-width: 600px) {

    .page-title {

        top: 7vh;

        font-size:
            clamp(
                34px,
                9vw,
                56px
            );
    }


    .number {

        font-size:
            clamp(
                45px,
                14vw,
                95px
            );
    }


    .unit {

        font-size:
            16px;

        letter-spacing:
            6px;
    }


    .diary-button {

        width: 58px;
        height: 58px;

        right: 15px;
        bottom: 15px;
    }


    .balloon-wrapper {

        transform:
            scale(.82);
    }

}

</style>
</head>


<body>

================================================= -->

<div id="balloon-area"></div>



<!-- =================================================

================================================= -->

<button
    class="diary-button"
    id="diaryButton">

<!-- =================================================

================================================= -->

<div
    class="diary-panel"
    id="diaryPanel">

<script>


/* =================================================
   카운트다운
================================================= */

const targetDate =
    new Date(
        2027,
        11,
        31,
        23,
        59,
        59,
        999
    );


const SECOND = 1000;

const MINUTE =
    SECOND * 60;

const HOUR =
    MINUTE * 60;

const DAY =
    HOUR * 24;

const WEEK =
    DAY * 7;

const YEAR =
    DAY * 365.2425;

const MONTH =
    YEAR / 12;



function formatNumber(number) {

    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        }
    );

}



function updateCountdown() {

    const now =
        new Date();

    let remaining =
        targetDate.getTime()
        -
        now.getTime();


    if (remaining < 0) {

        remaining = 0;

    }


    document.getElementById(
        "years"
    ).textContent =
        formatNumber(
            remaining / YEAR
        );


    document.getElementById(
        "months"
    ).textContent =
        formatNumber(
            remaining / MONTH
        );


    document.getElementById(
        "weeks"
    ).textContent =
        formatNumber(
            remaining / WEEK
        );


    document.getElementById(
        "days"
    ).textContent =
        formatNumber(
            remaining / DAY
        );


    document.getElementById(
        "hours"
    ).textContent =
        formatNumber(
            remaining / HOUR
        );


    document.getElementById(
        "minutes"
    ).textContent =
        formatNumber(
            remaining / MINUTE
        );


    document.getElementById(
        "seconds"
    ).textContent =
        formatNumber(
            remaining / SECOND
        );

}


updateCountdown();

setInterval(
    updateCountdown,
    100
);



/* =================================================
   일기
================================================= */

const diaryButton =
    document.getElementById(
        "diaryButton"
    );

const diaryPanel =
    document.getElementById(
        "diaryPanel"
    );

const closeDiary =
    document.getElementById(
        "closeDiary"
    );

const saveDiary =
    document.getElementById(
        "saveDiary"
    );

const diaryText =
    document.getElementById(
        "diaryText"
    );


/* =================================================
   저장된 일기
================================================= */

let diaries =
    JSON.parse(
        localStorage.getItem(
            "junDiary"
        ) || "[]"
    );


/* =================================================
   현재 보고 있는 일기
================================================= */

let selectedDiaryId =
    null;



/* =================================================
   일기 버튼
================================================= */

diaryButton.addEventListener(
    "click",
    () => {

        diaryPanel.classList.toggle(
            "open"
        );

    }
);


closeDiary.addEventListener(
    "click",
    () => {

        diaryPanel.classList.remove(
            "open"
        );

    }
);



/* =================================================
   풍선 색
================================================= */

const balloonColors = [
    "red",
    "blue",
    "yellow",
    "purple",
    "green"
];


function random(min, max) {

    return Math.random()
        * (max - min)
        + min;

}



/* =================================================
   풍선 만들기
================================================= */

const balloonArea =
    document.getElementById(
        "balloon-area"
    );


let balloons = [];



function createBalloon(diary) {

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "balloon-wrapper";


    const balloon =
        document.createElement(
            "div"
        );

    balloon.className =
        "balloon "
        +
        balloonColors[
            Math.floor(
                Math.random()
                *
                balloonColors.length
            )
        ];


    const text =
        document.createElement(
            "div"
        );

    text.className =
        "balloon-text";


    /*
       풍선에는 날짜 대신
       일기의 내용만 표시
    */

    text.textContent =
        diary.text.length > 55
        ? diary.text.substring(
            0,
            55
        ) + "..."
        : diary.text;


    const knot =
        document.createElement(
            "div"
        );

    knot.className =
        "balloon-knot";


    const string =
        document.createElement(
            "div"
        );

    string.className =
        "balloon-string";


    balloon.appendChild(
        text
    );

    balloon.appendChild(
        knot
    );


    wrapper.appendChild(
        balloon
    );

    wrapper.appendChild(
        string
    );


    const x =
        random(
            20,
            Math.max(
                21,
                window.innerWidth - 160
            )
        );


    const y =
        random(
            100,
            Math.max(
                101,
                window.innerHeight - 220
            )
        );


    wrapper.style.left =
        x + "px";

    wrapper.style.top =
        y + "px";


    const data = {

        element:
            wrapper,

        x:
            x,

        y:
            y,

        vx:
            random(
                -0.7,
                0.7
            ),

        vy:
            random(
                -0.7,
                0.7
            ),

        diary:
            diary

    };


    /*
       너무 느린 경우 방지
    */

    if (
        Math.abs(data.vx)
        < .25
    ) {

        data.vx =
            data.vx < 0
            ? -.4
            : .4;

    }


    if (
        Math.abs(data.vy)
        < .25
    ) {

        data.vy =
            data.vy < 0
            ? -.4
            : .4;

    }


    balloons.push(
        data
    );


    balloonArea.appendChild(
        wrapper
    );


    /*
       클릭
    */

    wrapper.addEventListener(
        "click",
        () => {

            showDiary(
                diary
            );

        }
    );

}



/* =================================================
   일기 저장
================================================= */

saveDiary.addEventListener(
    "click",
    () => {

        const text =
            diaryText.value.trim();


        if (!text) {

            alert(
                "일기를 적어주세요!"
            );

            return;

        }


        const now =
            new Date();


        /*
           날짜는 저장만 하고
           작성창에는 표시하지 않음
        */

        const diary = {

            id:
                Date.now(),

            date:
                now.toLocaleDateString(
                    "ko-KR",
                    {
                        year:
                            "numeric",

                        month:
                            "2-digit",

                        day:
                            "2-digit"
                    }
                ),

            text:
                text

        };


        diaries.push(
            diary
        );


        localStorage.setItem(
            "junDiary",
            JSON.stringify(
                diaries
            )
        );


        createBalloon(
            diary
        );


        diaryText.value =
            "";


        diaryPanel.classList.remove(
            "open"
        );

    }
);



/* =================================================
   기존 풍선 불러오기
================================================= */

diaries.forEach(
    diary => {

        createBalloon(
            diary
        );

    }
);



/* =================================================
   풍선 움직임
================================================= */

function animateBalloons() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    balloons.forEach(
        b => {

            b.x += b.vx;

            b.y += b.vy;


            const rect =
                b.element
                .getBoundingClientRect();


            const w =
                rect.width;

            const h =
                rect.height;


            /*
               화면 벽
            */

            if (
                b.x <= 0
            ) {

                b.x = 0;

                b.vx =
                    Math.abs(
                        b.vx
                    );

            }


            if (
                b.x + w >= width
            ) {

                b.x =
                    width - w;

                b.vx =
                    -Math.abs(
                        b.vx
                    );

            }


            if (
                b.y <= 0
            ) {

                b.y = 0;

                b.vy =
                    Math.abs(
                        b.vy
                    );

            }


            if (
                b.y + h >= height
            ) {

                b.y =
                    height - h;

                b.vy =
                    -Math.abs(
                        b.vy
                    );

            }


            b.element.style.left =
                b.x + "px";

            b.element.style.top =
                b.y + "px";

        }
    );


    /*
       풍선끼리 충돌
    */

    for (
        let i = 0;
        i < balloons.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < balloons.length;
            j++
        ) {

            const a =
                balloons[i];

            const b =
                balloons[j];


            const ar =
                a.element
                .getBoundingClientRect();

            const br =
                b.element
                .getBoundingClientRect();


            const hit =
                ar.left < br.right &&
                ar.right > br.left &&
                ar.top < br.bottom &&
                ar.bottom > br.top;


            if (hit) {

                /*
                   서로 튕겨나가도록
                   속도를 교환
                */

                const vx =
                    a.vx;

                const vy =
                    a.vy;


                a.vx =
                    b.vx;

                a.vy =
                    b.vy;


                b.vx =
                    vx;

                b.vy =
                    vy;


                /*
                   서로 겹치는 현상 완화
                */

                a.x -=
                    a.vx * 3;

                b.x -=
                    b.vx * 3;

            }

        }

    }


    requestAnimationFrame(
        animateBalloons
    );

}


animateBalloons();



/* =================================================
   일기 보기
================================================= */

const diaryView =
    document.getElementById(
        "diaryView"
    );

const diaryViewDate =
    document.getElementById(
        "diaryViewDate"
    );

const diaryViewText =
    document.getElementById(
        "diaryViewText"
    );

const deleteDiary =
    document.getElementById(
        "deleteDiary"
    );

const closeView =
    document.getElementById(
        "closeView"
    );



function showDiary(diary) {

    selectedDiaryId =
        diary.id;


    diaryViewDate.textContent =
        "📅 " + diary.date;


    diaryViewText.textContent =
        diary.text;


    diaryView.classList.add(
        "show"
    );

}



/* =================================================
   닫기
================================================= */

closeView.addEventListener(
    "click",
    () => {

        diaryView.classList.remove(
            "show"
        );

        selectedDiaryId =
            null;

    }
);



/* =================================================
   삭제
================================================= */

deleteDiary.addEventListener(
    "click",
    () => {

        if (
            selectedDiaryId === null
        ) {

            return;

        }


        /*
           확인
        */

        const confirmed =
            confirm(
                "이 일기를 삭제할까요?"
            );


        if (!confirmed) {

            return;

        }


        /*
           데이터에서 삭제
        */

        diaries =
            diaries.filter(
                diary =>
                    diary.id
                    !==
                    selectedDiaryId
            );


        localStorage.setItem(
            "junDiary",
            JSON.stringify(
                diaries
            )
        );


        /*
           화면의 풍선 삭제
        */

        balloons =
            balloons.filter(
                balloon => {

                    if (
                        balloon.diary.id
                        ===
                        selectedDiaryId
                    ) {

                        balloon.element.remove();

                        return false;

                    }

                    return true;

                }
            );


        diaryView.classList.remove(
            "show"
        );


        selectedDiaryId =
            null;

    }
);


/* =================================================
   화면 크기 변경
================================================= */

window.addEventListener(
    "resize",
    () => {

        balloons.forEach(
            b => {

                b.x =
                    Math.min(
                        b.x,
                        window.innerWidth - 140
                    );

                b.y =
                    Math.min(
                        b.y,
                        window.innerHeight - 190
                    );

            }
        );

    }
);

</script>
