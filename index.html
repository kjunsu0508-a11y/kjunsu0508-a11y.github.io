<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>준수가 한국으로 돌아가기까지...</title>

<!-- 유쾌하고 둥근 느낌의 웹폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    background: #111;

    color: white;

    font-family:
        "Fredoka",
        sans-serif;

    overflow-x: hidden;
}


/* =========================================
   모든 화면
   ========================================= */

.time-section {

    width: 100%;

    height: 100vh;
    height: 100svh;

    min-height: 100vh;
    min-height: 100svh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    position: relative;

    overflow: hidden;

    padding: 30px 20px;
}


/* =========================================
   첫 화면 제목
   ========================================= */

.page-title {

    position: absolute;

    /*
       화면 맨 위에서 조금 떨어진 위치
    */

    top: 9vh;

    left: 20px;
    right: 20px;

    font-size:
        clamp(38px, 6vw, 82px);

    font-weight: 700;

    line-height: 1.12;

    letter-spacing: -2px;

    text-shadow:
        0 6px 25px rgba(0,0,0,0.25);

    z-index: 2;
}


/* =========================================
   단위 이름
   ========================================= */

.unit {

    font-size:
        clamp(18px, 2.5vw, 30px);

    font-weight: 600;

    letter-spacing: 8px;

    margin-bottom: 22px;

    color:
        rgba(255,255,255,0.65);
}


/* =========================================
   숫자
   ========================================= */

.number {

    /*
       너무 커서 잘리지 않도록 제한
    */

    width: 100%;

    padding:
        0 15px;

    font-size:
        clamp(52px, 12vw, 160px);

    font-weight: 700;

    line-height: 1;

    letter-spacing: -3px;

    font-variant-numeric:
        tabular-nums;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: clip;

    text-shadow:
        0 10px 35px rgba(0,0,0,0.3);
}


/* =========================================
   설명
   ========================================= */

.description {

    margin-top: 28px;

    font-size:
        clamp(18px, 2.5vw, 28px);

    font-weight: 500;

    color:
        rgba(255,255,255,0.6);
}


/* =========================================
   자연스러운 색 변화
   ========================================= */

.years {

    background:
        linear-gradient(
            180deg,
            #172b48 0%,
            #263d5c 100%
        );
}


.months {

    background:
        linear-gradient(
            180deg,
            #263d5c 0%,
            #3c3b65 100%
        );
}


.weeks {

    background:
        linear-gradient(
            180deg,
            #3c3b65 0%,
            #514465 100%
        );
}


.days {

    background:
        linear-gradient(
            180deg,
            #514465 0%,
            #69514e 100%
        );
}


.hours {

    background:
        linear-gradient(
            180deg,
            #69514e 0%,
            #76533f 100%
        );
}


.minutes {

    background:
        linear-gradient(
            180deg,
            #76533f 0%,
            #526953 100%
        );
}


.seconds {

    background:
        linear-gradient(
            180deg,
            #526953 0%,
            #263f40 100%
        );
}


/* =========================================
   모바일
   ========================================= */

@media (max-width: 600px) {

    .page-title {

        top: 8vh;

        font-size:
            clamp(34px, 9vw, 55px);

        letter-spacing:
            -1.5px;
    }


    .unit {

        font-size: 16px;

        letter-spacing: 6px;

        margin-bottom: 18px;
    }


    .number {

        font-size:
            clamp(45px, 14vw, 95px);

        letter-spacing:
            -2px;

        padding:
            0 5px;
    }


    .description {

        margin-top: 20px;

        font-size: 17px;
    }

}

</style>
</head>


<body>


<!-- =========================================
     YEARS
     제목은 여기서 딱 한 번만
     ========================================= -->

<section class="time-section years">

    <div class="page-title">
        준수가 한국으로 돌아가기까지...
    </div>


    <div class="unit">
        YEARS
    </div>


    <div
        class="number"
        id="years">
        0.0
    </div>


    <div class="description">
        년으로 보면
    </div>

</section>



<!-- =========================================
     MONTHS
     ========================================= -->

<section class="time-section months">

    <div class="unit">
        MONTHS
    </div>


    <div
        class="number"
        id="months">
        0.0
    </div>


    <div class="description">
        달로 보면
    </div>

</section>



<!-- =========================================
     WEEKS
     ========================================= -->

<section class="time-section weeks">

    <div class="unit">
        WEEKS
    </div>


    <div
        class="number"
        id="weeks">
        0.0
    </div>


    <div class="description">
        주일로 보면
    </div>

</section>



<!-- =========================================
     DAYS
     ========================================= -->

<section class="time-section days">

    <div class="unit">
        DAYS
    </div>


    <div
        class="number"
        id="days">
        0.0
    </div>


    <div class="description">
        일로 보면
    </div>

</section>



<!-- =========================================
     HOURS
     ========================================= -->

<section class="time-section hours">

    <div class="unit">
        HOURS
    </div>


    <div
        class="number"
        id="hours">
        0.0
    </div>


    <div class="description">
        시간으로 보면
    </div>

</section>



<!-- =========================================
     MINUTES
     ========================================= -->

<section class="time-section minutes">

    <div class="unit">
        MINUTES
    </div>


    <div
        class="number"
        id="minutes">
        0.0
    </div>


    <div class="description">
        분으로 보면
    </div>

</section>



<!-- =========================================
     SECONDS
     ========================================= -->

<section class="time-section seconds">

    <div class="unit">
        SECONDS
    </div>


    <div
        class="number"
        id="seconds">
        0.0
    </div>


    <div class="description">
        초로 보면
    </div>

</section>



<script>


/* =========================================
   목표 날짜
   2027년 12월 31일 23:59:59.999
   ========================================= */

const targetDate =
    new Date(
        2027,
        11,
        31,
        23,
        59,
        59,
        999
    );


/* =========================================
   시간 단위
   ========================================= */

const SECOND =
    1000;

const MINUTE =
    SECOND * 60;

const HOUR =
    MINUTE * 60;

const DAY =
    HOUR * 24;

const WEEK =
    DAY * 7;


/* 평균적인 1년 */

const YEAR =
    DAY * 365.2425;


/* 평균적인 1개월 */

const MONTH =
    YEAR / 12;



/* =========================================
   숫자 표시
   ========================================= */

function formatNumber(number) {

    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        }
    );

}



/* =========================================
   카운트다운
   ========================================= */

function updateCountdown() {

    const now =
        new Date();


    let remaining =
        targetDate.getTime()
        -
        now.getTime();


    if (remaining < 0) {

        remaining = 0;

    }


    /*
       같은 남은 시간을
       각각의 단위로 표현
    */

    const years =
        remaining / YEAR;

    const months =
        remaining / MONTH;

    const weeks =
        remaining / WEEK;

    const days =
        remaining / DAY;

    const hours =
        remaining / HOUR;

    const minutes =
        remaining / MINUTE;

    const seconds =
        remaining / SECOND;



    /*
       화면에 표시
    */

    document.getElementById(
        "years"
    ).textContent =
        formatNumber(years);


    document.getElementById(
        "months"
    ).textContent =
        formatNumber(months);


    document.getElementById(
        "weeks"
    ).textContent =
        formatNumber(weeks);


    document.getElementById(
        "days"
    ).textContent =
        formatNumber(days);


    document.getElementById(
        "hours"
    ).textContent =
        formatNumber(hours);


    document.getElementById(
        "minutes"
    ).textContent =
        formatNumber(minutes);


    document.getElementById(
        "seconds"
    ).textContent =
        formatNumber(seconds);

}


/* =========================================
   시작
   ========================================= */

updateCountdown();


/*
   0.1초마다 업데이트
*/

setInterval(
    updateCountdown,
    100
);

</script>

</body>
</html>
