<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>준수가 한국으로 돌아가기까지...</title>


<!-- =====================================================
     FONTS
===================================================== -->

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Gowun+Dodum&display=swap"
rel="stylesheet">


<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    background: #111;

    color: white;

    font-family:
        "Fredoka",
        "Gowun Dodum",
        sans-serif;

    overflow-x: hidden;
}


/* =====================================================
   COUNTDOWN
===================================================== */

.time-section {

    width: 100%;

    height: 100vh;

    height: 100svh;

    min-height: 100vh;

    min-height: 100svh;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    position: relative;

    overflow: hidden;

    padding: 30px 20px;
}


/* =====================================================
   TITLE
===================================================== */

.page-title {

    position: absolute;

    top: 8vh;

    left: 20px;

    right: 20px;

    font-size:
        clamp(38px, 6vw, 80px);

    font-weight: 700;

    line-height: 1.1;

    letter-spacing: -2px;

    text-shadow:
        3px 4px 0 rgba(0,0,0,.18);

    z-index: 10;
}


/* =====================================================
   UNIT
===================================================== */

.unit {

    font-size:
        clamp(17px, 2.5vw, 29px);

    font-weight: 600;

    letter-spacing: 8px;

    margin-bottom: 20px;

    color:
        rgba(255,255,255,.65);
}


/* =====================================================
   NUMBER
===================================================== */

.number {

    width: 100%;

    padding: 0 10px;

    font-size:
        clamp(50px, 12vw, 160px);

    font-weight: 700;

    line-height: 1;

    letter-spacing: -3px;

    font-variant-numeric:
        tabular-nums;

    white-space: nowrap;

    overflow: hidden;

    text-shadow:
        4px 7px 0 rgba(0,0,0,.18);
}


/* =====================================================
   DESCRIPTION
===================================================== */

.description {

    margin-top: 25px;

    font-size:
        clamp(17px, 2.5vw, 27px);

    font-weight: 500;

    color:
        rgba(255,255,255,.65);
}


/* =====================================================
   BACKGROUNDS
===================================================== */

.years {

    background:
        linear-gradient(
            180deg,
            #172b48,
            #29425e
        );
}

.months {

    background:
        linear-gradient(
            180deg,
            #29425e,
            #443e68
        );
}

.weeks {

    background:
        linear-gradient(
            180deg,
            #443e68,
            #59466a
        );
}

.days {

    background:
        linear-gradient(
            180deg,
            #59466a,
            #6d514d
        );
}

.hours {

    background:
        linear-gradient(
            180deg,
            #6d514d,
            #78513c
        );
}

.minutes {

    background:
        linear-gradient(
            180deg,
            #78513c,
            #52694f
        );
}

.seconds {

    background:
        linear-gradient(
            180deg,
            #52694f,
            #263f40
        );
}


/* =====================================================
   RIGHT MENU
===================================================== */

.site-menu {

    position: fixed;

    right: 18px;

    bottom: 18px;

    z-index: 9000;

    display: flex;

    flex-direction: column;

    gap: 9px;
}


.menu-button {

    width: 62px;

    height: 62px;

    border:
        3px solid #4e3927;

    border-radius: 10px;

    background:
        #f4d58d;

    color:
        #4e3927;

    font-size: 26px;

    cursor: pointer;

    box-shadow:
        4px 5px 0 #38291d;

    transition:
        .2s;
}


.menu-button:hover {

    transform:
        translateY(-3px)
        rotate(-3deg);

    box-shadow:
        6px 7px 0 #38291d;
}


/* =====================================================
   DIARY PANEL
===================================================== */

.diary-panel {

    position: fixed;

    right: 95px;

    bottom: 18px;

    width:
        min(
            390px,
            calc(100vw - 115px)
        );

    background:
        #fff4c9;

    color:
        #493827;

    border:
        4px solid #5b402b;

    border-radius:
        8px;

    padding:
        22px;

    z-index:
        8999;

    box-shadow:
        8px 9px 0
        rgba(0,0,0,.35);

    opacity: 0;

    transform:
        translateY(20px)
        scale(.95);

    pointer-events:
        none;

    transition:
        .2s;
}


.diary-panel.open {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);

    pointer-events:
        auto;
}


.diary-header {

    display: flex;

    justify-content:
        space-between;

    align-items:
        center;

    border-bottom:
        2px dashed #b49a68;

    padding-bottom:
        12px;

    margin-bottom:
        15px;
}


.diary-header h2 {

    margin: 0;

    font-size: 23px;
}


.close-button {

    border: none;

    background: transparent;

    color: #493827;

    font-size: 25px;

    cursor: pointer;
}


.diary-label {

    display: block;

    margin-top: 12px;

    margin-bottom: 5px;

    font-size: 14px;

    font-weight: bold;
}


.diary-textarea {

    width: 100%;

    height: 125px;

    resize: none;

    border:
        2px solid #bba477;

    border-radius:
        5px;

    padding:
        10px;

    background:
        #fffbea;

    color:
        #493827;

    font-family:
        "Gowun Dodum",
        sans-serif;

    font-size:
        15px;

    outline:
        none;
}


.save-diary {

    width: 100%;

    margin-top: 15px;

    padding: 11px;

    border:
        3px solid #4e3927;

    border-radius:
        5px;

    background:
        #dfb967;

    color:
        #4e3927;

    font-family:
        "Fredoka",
        sans-serif;

    font-size:
        16px;

    font-weight:
        600;

    cursor:
        pointer;

    box-shadow:
        3px 3px 0 #4e3927;
}


.save-diary:active {

    transform:
        translate(2px,2px);

    box-shadow:
        1px 1px 0 #4e3927;
}


/* =====================================================
   BALLOON AREA
===================================================== */

#balloon-area {

    position: fixed;

    inset: 0;

    pointer-events:
        none;

    z-index:
        500;
}


.balloon-wrapper {

    position: absolute;

    width:
        130px;

    height:
        180px;

    pointer-events:
        auto;

    cursor:
        pointer;

    user-select:
        none;
}


.balloon {

    position: absolute;

    left: 10px;

    top: 0;

    width:
        105px;

    height:
        125px;

    border-radius:
        50% 50% 48% 48%;

    box-shadow:

        inset
        -13px
        -15px
        20px
        rgba(0,0,0,.13),

        inset
        12px
        10px
        12px
        rgba(255,255,255,.35),

        4px
        7px
        0
        rgba(0,0,0,.15);
}


.balloon::after {

    content: "";

    position: absolute;

    left: 43px;

    bottom: -10px;

    width:
        18px;

    height:
        18px;

    background:
        inherit;

    transform:
        rotate(45deg);
}


.balloon::before {

    content: "";

    position: absolute;

    width:
        25px;

    height:
        38px;

    left:
        18px;

    top:
        17px;

    background:
        rgba(255,255,255,.38);

    border-radius:
        50%;

    transform:
        rotate(25deg);
}


.balloon-text {

    position: absolute;

    left:
        15px;

    right:
        15px;

    top:
        43px;

    text-align:
        center;

    color:
        white;

    font-family:
        "Gowun Dodum",
        sans-serif;

    font-size:
        13px;

    line-height:
        1.3;

    font-weight:
        bold;

    z-index:
        2;

    overflow:
        hidden;

    display:
        -webkit-box;

    -webkit-line-clamp:
        3;

    -webkit-box-orient:
        vertical;

    text-shadow:
        1px 1px 2px
        rgba(0,0,0,.25);
}


.balloon-string {

    position: absolute;

    left:
        62px;

    top:
        132px;

    width:
        2px;

    height:
        47px;

    background:
        rgba(255,255,255,.75);

    transform:
        rotate(3deg);

    transform-origin:
        top;
}


.balloon-knot {

    position: absolute;

    left:
        53px;

    top:
        117px;

    width:
        18px;

    height:
        18px;

    background:
        inherit;

    transform:
        rotate(45deg);

    z-index:
        1;
}


/* Balloon colors */

.balloon.red {

    background:
        linear-gradient(
            135deg,
            #ff7c8c,
            #d94763
        );
}

.balloon.blue {

    background:
        linear-gradient(
            135deg,
            #75c9ff,
            #4786d9
        );
}

.balloon.yellow {

    background:
        linear-gradient(
            135deg,
            #ffe77b,
            #e8b832
        );
}

.balloon.purple {

    background:
        linear-gradient(
            135deg,
            #c99cff,
            #8961c9
        );
}

.balloon.green {

    background:
        linear-gradient(
            135deg,
            #82dfa2,
            #43a96d
        );
}


/* =====================================================
   DIARY VIEW
===================================================== */

.diary-view {

    position: fixed;

    left:
        50%;

    top:
        50%;

    width:
        min(
            430px,
            calc(100vw - 40px)
        );

    background:
        #fff4c9;

    color:
        #493827;

    border:
        4px solid #5b402b;

    border-radius:
        8px;

    padding:
        25px;

    z-index:
        10000;

    box-shadow:
        9px 10px 0
        rgba(0,0,0,.4);

    opacity:
        0;

    pointer-events:
        none;

    transform:
        translate(-50%,-50%)
        scale(.9);

    transition:
        .2s;
}


.diary-view.show {

    opacity:
        1;

    pointer-events:
        auto;

    transform:
        translate(-50%,-50%)
        scale(1);
}


.diary-view-date {

    font-size:
        14px;

    color:
        #927957;

    margin-bottom:
        12px;

    border-bottom:
        2px dashed #b49a68;

    padding-bottom:
        8px;
}


.diary-view-text {

    font-family:
        "Gowun Dodum",
        sans-serif;

    white-space:
        pre-wrap;

    line-height:
        1.7;

    min-height:
        80px;

    word-break:
        break-word;
}


.view-buttons {

    display:
        flex;

    gap:
        10px;

    margin-top:
        20px;
}


.delete-diary,
.close-view {

    flex:
        1;

    padding:
        10px;

    border-radius:
        5px;

    font-family:
        "Fredoka",
        sans-serif;

    font-weight:
        600;

    cursor:
        pointer;
}


.delete-diary {

    border:
        3px solid #7b3131;

    background:
        #ef9999;

    color:
        #572020;
}


.close-view {

    border:
        3px solid #4e3927;

    background:
        #dfb967;

    color:
        #4e3927;
}


/* =====================================================
   =====================================================
   MEME / IMAGE BOARD
   =====================================================
===================================================== */


/*
   전체 이미지 보드
*/

#meme-board {

    position:
        fixed;

    inset:
        0;

    background:
        #ffffff;

    color:
        #222;

    z-index:
        20000;

    display:
        none;

    overflow:
        hidden;
}


/*
   보드가 열렸을 때
*/

#meme-board.open {

    display:
        block;
}


/* =====================================================
   MEME HEADER
===================================================== */

.meme-header {

    position:
        absolute;

    top:
        0;

    left:
        0;

    right:
        0;

    height:
        64px;

    background:
        #f3f3f3;

    border-bottom:
        2px solid #222;

    display:
        flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        10px 15px;

    z-index:
        30000;
}


.meme-title {

    font-weight:
        700;

    font-size:
        20px;

    margin-right:
        auto;
}


/* =====================================================
   MEME BUTTONS
===================================================== */

.meme-control {

    border:
        2px solid #222;

    background:
        #fff;

    color:
        #222;

    border-radius:
        5px;

    padding:
        8px 12px;

    font-family:
        "Fredoka",
        sans-serif;

    font-size:
        14px;

    cursor:
        pointer;

    box-shadow:
        2px 2px 0 #222;
}


.meme-control:hover {

    background:
        #eeeeee;
}


.meme-control:active {

    transform:
        translate(2px,2px);

    box-shadow:
        none;
}


/* =====================================================
   MEME CANVAS
===================================================== */

#meme-canvas {

    position:
        absolute;

    left:
        0;

    top:
        64px;

    width:
        100%;

    height:
        calc(100% - 64px);

    overflow:
        hidden;

    background:
        white;
}


/*
   이미지 객체
*/

.meme-image {

    position:
        absolute;

    width:
        240px;

    height:
        auto;

    left:
        100px;

    top:
        100px;

    cursor:
        grab;

    user-select:
        none;

    transform-origin:
        center center;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.18);

    border:
        1px solid
        rgba(0,0,0,.1);
}


.meme-image:active {

    cursor:
        grabbing;
}


/*
   선택된 이미지
*/

.meme-image.selected {

    outline:
        3px dashed #333;

    outline-offset:
        4px;
}


/* =====================================================
   IMAGE INFO
===================================================== */

.meme-help {

    position:
        absolute;

    left:
        15px;

    bottom:
        12px;

    padding:
        7px 10px;

    background:
        rgba(255,255,255,.9);

    border:
        1px solid #bbb;

    font-size:
        12px;

    color:
        #555;

    z-index:
        30000;

    pointer-events:
        none;
}


/* =====================================================
   IMAGE SIZE POPUP
===================================================== */

.image-size-panel {

    position:
        absolute;

    top:
        75px;

    right:
        15px;

    width:
        190px;

    background:
        white;

    border:
        2px solid #222;

    padding:
        12px;

    box-shadow:
        4px 4px 0
        rgba(0,0,0,.2);

    z-index:
        30000;

    display:
        none;
}


.image-size-panel.show {

    display:
        block;
}


.image-size-panel label {

    display:
        block;

    font-size:
        12px;

    margin-bottom:
        5px;
}


#size-slider {

    width:
        100%;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .page-title {

        top:
            7vh;

        font-size:
            clamp(
                34px,
                9vw,
                56px
            );
    }


    .number {

        font-size:
            clamp(
                45px,
                14vw,
                95px
            );
    }


    .unit {

        font-size:
            16px;

        letter-spacing:
            6px;
    }


    .site-menu {

        right:
            12px;

        bottom:
            12px;
    }


    .menu-button {

        width:
            54px;

        height:
            54px;

        font-size:
            22px;
    }


    .diary-panel {

        right:
            76px;

        bottom:
            12px;

        width:
            calc(
                100vw - 88px
            );
    }


    .meme-header {

        height:
            58px;

        padding:
            8px;
    }


    .meme-title {

        display:
            none;
    }


    .meme-control {

        padding:
            7px 8px;

        font-size:
            12px;
    }


    #meme-canvas {

        top:
            58px;

        height:
            calc(
                100% - 58px
            );
    }

}

</style>

</head>


<body>


<!-- =====================================================
     COUNTDOWN
===================================================== -->

<section class="time-section years">

    <div class="page-title">
        준수가 한국으로 돌아가기까지...
    </div>

    <div class="unit">
        YEARS
    </div>

    <div
        class="number"
        id="years">
        0.0
    </div>

    <div class="description">
        년으로 보면
    </div>

</section>


<section class="time-section months">

    <div class="unit">
        MONTHS
    </div>

    <div
        class="number"
        id="months">
        0.0
    </div>

    <div class="description">
        달로 보면
    </div>

</section>


<section class="time-section weeks">

    <div class="unit">
        WEEKS
    </div>

    <div
        class="number"
        id="weeks">
        0.0
    </div>

    <div class="description">
        주일로 보면
    </div>

</section>


<section class="time-section days">

    <div class="unit">
        DAYS
    </div>

    <div
        class="number"
        id="days">
        0.0
    </div>

    <div class="description">
        일로 보면
    </div>

</section>


<section class="time-section hours">

    <div class="unit">
        HOURS
    </div>

    <div
        class="number"
        id="hours">
        0.0
    </div>

    <div class="description">
        시간으로 보면
    </div>

</section>


<section class="time-section minutes">

    <div class="unit">
        MINUTES
    </div>

    <div
        class="number"
        id="minutes">
        0.0
    </div>

    <div class="description">
        분으로 보면
    </div>

</section>


<section class="time-section seconds">

    <div class="unit">
        SECONDS
    </div>

    <div
        class="number"
        id="seconds">
        0.0
    </div>

    <div class="description">
        초로 보면
    </div>

</section>


<!-- =====================================================
     BALLOONS
===================================================== -->

<div id="balloon-area"></div>


<!-- =====================================================
     RIGHT MENU
===================================================== -->

<div class="site-menu">

    <button
        class="menu-button"
        id="diaryButton"
        title="일기">

        📔

    </button>


    <button
        class="menu-button"
        id="memeButton"
        title="짤방">

        🖼️

    </button>

</div>


<!-- =====================================================
     DIARY PANEL
===================================================== -->

<div
    class="diary-panel"
    id="diaryPanel">

    <div class="diary-header">

        <h2>
            ✎ 오늘의 일기
        </h2>

        <button
            class="close-button"
            id="closeDiary">

            ×

        </button>

    </div>


    <label class="diary-label">
        오늘의 기록
    </label>


    <textarea
        id="diaryText"
        class="diary-textarea"
        placeholder="오늘 있었던 일을 적어보세요..."
    ></textarea>


    <button
        class="save-diary"
        id="saveDiary">

        🎈 풍선으로 남기기

    </button>

</div>


<!-- =====================================================
     DIARY VIEW
===================================================== -->

<div
    class="diary-view"
    id="diaryView">

    <div
        class="diary-view-date"
        id="diaryViewDate">
    </div>


    <div
        class="diary-view-text"
        id="diaryViewText">
    </div>


    <div class="view-buttons">

        <button
            class="delete-diary"
            id="deleteDiary">

            🗑 삭제

        </button>


        <button
            class="close-view"
            id="closeView">

            닫기

        </button>

    </div>

</div>


<!-- =====================================================
     MEME BOARD
===================================================== -->

<div
    id="meme-board">


    <!-- HEADER -->

    <div class="meme-header">

        <div class="meme-title">
            🖼️ 짤방 보관소
        </div>


        <!-- 이미지 업로드 -->

        <input
            type="file"
            id="image-input"
            accept="image/*"
            multiple
            hidden
        >


        <button
            class="meme-control"
            id="add-image">

            ＋ 이미지

        </button>


        <button
            class="meme-control"
            id="delete-image">

            🗑 삭제

        </button>


        <button
            class="meme-control"
            id="close-meme">

            ← 돌아가기

        </button>

    </div>


    <!-- CANVAS -->

    <div id="meme-canvas">


        <div class="meme-help">

            이미지 클릭 → 크기 조절<br>
            드래그 → 이동<br>
            마우스 휠 → 확대 / 축소

        </div>


        <!-- SIZE PANEL -->

        <div
            class="image-size-panel"
            id="image-size-panel">

            <label>
                이미지 크기
            </label>


            <input
                type="range"
                id="size-slider"
                min="50"
                max="800"
                value="240"
            >

        </div>

    </div>

</div>


<script>

/* =====================================================
   COUNTDOWN
===================================================== */

const targetDate =
    new Date(
        2027,
        11,
        31,
        23,
        59,
        59,
        999
    );


const SECOND = 1000;

const MINUTE =
    SECOND * 60;

const HOUR =
    MINUTE * 60;

const DAY =
    HOUR * 24;

const WEEK =
    DAY * 7;

const YEAR =
    DAY * 365.2425;

const MONTH =
    YEAR / 12;


function formatNumber(number) {

    return number.toLocaleString(
        "en-US",
        {
            minimumFractionDigits: 1,

            maximumFractionDigits: 1
        }
    );

}


function updateCountdown() {

    const now =
        new Date();

    let remaining =
        targetDate.getTime()
        -
        now.getTime();


    if (remaining < 0) {

        remaining = 0;

    }


    document.getElementById(
        "years"
    ).textContent =
        formatNumber(
            remaining / YEAR
        );


    document.getElementById(
        "months"
    ).textContent =
        formatNumber(
            remaining / MONTH
        );


    document.getElementById(
        "weeks"
    ).textContent =
        formatNumber(
            remaining / WEEK
        );


    document.getElementById(
        "days"
    ).textContent =
        formatNumber(
            remaining / DAY
        );


    document.getElementById(
        "hours"
    ).textContent =
        formatNumber(
            remaining / HOUR
        );


    document.getElementById(
        "minutes"
    ).textContent =
        formatNumber(
            remaining / MINUTE
        );


    document.getElementById(
        "seconds"
    ).textContent =
        formatNumber(
            remaining / SECOND
        );

}


updateCountdown();

setInterval(
    updateCountdown,
    100
);

/* =====================================================
   BALLOONS
===================================================== */

const balloonArea =
    document.getElementById(
        "balloon-area"
    );


const balloonColors = [
    "red",
    "blue",
    "yellow",
    "purple",
    "green"
];


let balloons = [];


function random(min,max) {

    return Math.random()
        * (max-min)
        + min;

}


function createBalloon(diary) {

    const wrapper =
        document.createElement(
            "div"
        );


    wrapper.className =
        "balloon-wrapper";


    const balloon =
        document.createElement(
            "div"
        );


    balloon.className =
        "balloon "
        +
        balloonColors[
            Math.floor(
                Math.random()
                *
                balloonColors.length
            )
        ];


    const text =
        document.createElement(
            "div"
        );


    text.className =
        "balloon-text";


    text.textContent =
        diary.text.length > 55
        ? diary.text.substring(
            0,
            55
        ) + "..."
        : diary.text;


    const knot =
        document.createElement(
            "div"
        );


    knot.className =
        "balloon-knot";


    const string =
        document.createElement(
            "div"
        );


    string.className =
        "balloon-string";


    balloon.appendChild(
        text
    );

    balloon.appendChild(
        knot
    );


    wrapper.appendChild(
        balloon
    );

    wrapper.appendChild(
        string
    );


    const x =
        random(
            20,
            Math.max(
                21,
                window.innerWidth - 160
            )
        );


    const y =
        random(
            100,
            Math.max(
                101,
                window.innerHeight - 220
            )
        );


    wrapper.style.left =
        x + "px";


    wrapper.style.top =
        y + "px";


    const data = {

        element:
            wrapper,

        x:
            x,

        y:
            y,

        vx:
            random(
                -.7,
                .7
            ),

        vy:
            random(
                -.7,
                .7
            ),

        diary:
            diary

    };


    if (
        Math.abs(data.vx)
        < .25
    ) {

        data.vx =
            data.vx < 0
            ? -.4
            : .4;

    }


    if (
        Math.abs(data.vy)
        < .25
    ) {

        data.vy =
            data.vy < 0
            ? -.4
            : .4;

    }


    balloons.push(
        data
    );


    balloonArea.appendChild(
        wrapper
    );


    wrapper.addEventListener(
        "click",
        () => {

            showDiary(
                diary
            );

        }
    );

}

/* =====================================================
   BALLOON PHYSICS
===================================================== */

function animateBalloons() {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;


    balloons.forEach(
        b => {

            b.x += b.vx;

            b.y += b.vy;


            const rect =
                b.element
                .getBoundingClientRect();


            const w =
                rect.width;

            const h =
                rect.height;


            if (
                b.x <= 0
            ) {

                b.x = 0;

                b.vx =
                    Math.abs(
                        b.vx
                    );

            }


            if (
                b.x + w >= width
            ) {

                b.x =
                    width - w;

                b.vx =
                    -Math.abs(
                        b.vx
                    );

            }


            if (
                b.y <= 0
            ) {

                b.y = 0;

                b.vy =
                    Math.abs(
                        b.vy
                    );

            }


            if (
                b.y + h >= height
            ) {

                b.y =
                    height - h;

                b.vy =
                    -Math.abs(
                        b.vy
                    );

            }


            b.element.style.left =
                b.x + "px";

            b.element.style.top =
                b.y + "px";

        }
    );


    for (
        let i = 0;
        i < balloons.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < balloons.length;
            j++
        ) {

            const a =
                balloons[i];

            const b =
                balloons[j];


            const ar =
                a.element
                .getBoundingClientRect();


            const br =
                b.element
                .getBoundingClientRect();


            const hit =
                ar.left < br.right &&
                ar.right > br.left &&
                ar.top < br.bottom &&
                ar.bottom > br.top;


            if (hit) {

                const vx =
                    a.vx;

                const vy =
                    a.vy;


                a.vx =
                    b.vx;

                a.vy =
                    b.vy;


                b.vx =
                    vx;

                b.vy =
                    vy;


                a.x -=
                    a.vx * 3;

                b.x -=
                    b.vx * 3;

            }

        }

    }


    requestAnimationFrame(
        animateBalloons
    );

}


animateBalloons();

===================================================== */

addImage.addEventListener(

    }
);


/* =====================================================
   IMAGE UPLOAD
===================================================== */

imageInput.addEventListener(
    "change",
    event => {

        const files =
            Array.from(
                event.target.files
            );


        files.forEach(
            file => {

                if (
                    !file.type.startsWith(
                        "image/"
                    )
                ) {

                    return;

                }


                const reader =
                    new FileReader();


                reader.onload =
                    e => {

                        const imageData = {

                            id:
                                Date.now()
                                +
                                Math.random(),

                            src:
                                e.target.result,

                            x:
                                100
                                +
                                Math.random()
                                * 200,

                            y:
                                100
                                +
                                Math.random()
                                * 200,

                            width:
                                240

                        };


                        memeImages.push(
                            imageData
                        );


                        saveMemeImages();


                        createMemeImage(
                            imageData
                        );

                    };


                reader.readAsDataURL(
                    file
                );

            }
        );


        /*
           같은 파일을 다시 선택할 수 있게
        */

        imageInput.value =
            "";

    }
);


/* =====================================================
   SAVE MEME DATA
===================================================== */

function saveMemeImages() {

    try {

        localStorage.setItem(
            "junMemeImages",
            JSON.stringify(
                memeImages
            )
        );

    }
    catch(error) {

        alert(
            "이미지가 너무 많거나 너무 커서 저장할 수 없습니다.\n"
            +
            "큰 이미지를 몇 장 삭제해 주세요."
        );

    }

}


/* =====================================================
   CREATE IMAGE
===================================================== */

function createMemeImage(data) {

    const img =
        document.createElement(
            "img"
        );


    img.className =
        "meme-image";


    img.src =
        data.src;


    img.style.left =
        data.x + "px";


    img.style.top =
        data.y + "px";


    img.style.width =
        data.width + "px";


    img.dataset.id =
        data.id;


    memeCanvas.appendChild(
        img
    );


    /*
       클릭
    */

    img.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            selectMemeImage(
                data,
                img
            );

        }
    );


    /*
       드래그
    */

    let dragging =
        false;

    let offsetX =
        0;

    let offsetY =
        0;


    img.addEventListener(
        "mousedown",
        event => {

            /*
               클릭 후 드래그
            */

            dragging =
                true;


            offsetX =
                event.clientX
                -
                img.offsetLeft;


            offsetY =
                event.clientY
                -
                img.offsetTop;


            event.preventDefault();

        }
    );


    window.addEventListener(
        "mousemove",
        event => {

            if (!dragging) {

                return;

            }


            const rect =
                memeCanvas
                .getBoundingClientRect();


            data.x =
                event.clientX
                -
                rect.left
                -
                offsetX;


            data.y =
                event.clientY
                -
                rect.top
                -
                offsetY;


            img.style.left =
                data.x + "px";


            img.style.top =
                data.y + "px";


            saveMemeImages();

        }
    );


    window.addEventListener(
        "mouseup",
        () => {

            dragging =
                false;

        }
    );


    /*
       마우스 휠 확대/축소
    */

    img.addEventListener(
        "wheel",
        event => {

            event.preventDefault();


            let newWidth =
                data.width;


            if (
                event.deltaY < 0
            ) {

                newWidth +=
                    20;

            }
            else {

                newWidth -=
                    20;

            }


            newWidth =
                Math.max(
                    50,
                    Math.min(
                        800,
                        newWidth
                    )
                );


            data.width =
                newWidth;


            img.style.width =
                newWidth + "px";


            sizeSlider.value =
                newWidth;


            saveMemeImages();

        },
        {
            passive:
                false
        }
    );

}


/* =====================================================
   SELECT IMAGE
===================================================== */

function selectMemeImage(
    data,
    element
) {

    /*
       이전 선택 해제
    */

    document
        .querySelectorAll(
            ".meme-image.selected"
        )
        .forEach(
            img =>
                img.classList.remove(
                    "selected"
                )
        );


    element.classList.add(
        "selected"
    );


    selectedImage = {

        data:
            data,

        element:
            element

    };


    sizePanel.classList.add(
        "show"
    );


    sizeSlider.value =
        data.width;

}


/* =====================================================
   SIZE SLIDER
===================================================== */

sizeSlider.addEventListener(
    "input",
    () => {

        if (
            !selectedImage
        ) {

            return;

        }


        const data =
            selectedImage.data;

        const img =
            selectedImage.element;


        data.width =
            Number(
                sizeSlider.value
            );


        img.style.width =
            data.width + "px";


        saveMemeImages();

    }
);


/* =====================================================
   DELETE IMAGE
===================================================== */

deleteImage.addEventListener(
    "click",
    () => {

        if (
            !selectedImage
        ) {

            alert(
                "먼저 이미지를 클릭해 주세요."
            );

            return;

        }


        const id =
            selectedImage.data.id;


        memeImages =
            memeImages.filter(
                image =>
                    image.id !== id
            );


        selectedImage.element.remove();


        selectedImage =
            null;


        sizePanel.classList.remove(
            "show"
        );


        saveMemeImages();

    }
);


/* =====================================================
   CANVAS CLICK
===================================================== */

memeCanvas.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            memeCanvas
        ) {

            document
                .querySelectorAll(
                    ".meme-image.selected"
                )
                .forEach(
                    img =>
                        img.classList.remove(
                            "selected"
                        )
                );


            selectedImage =
                null;


            sizePanel.classList.remove(
                "show"
            );

        }

    }
);


/* =====================================================
   RENDER ALL IMAGES
===================================================== */

function renderAllImages() {

    document
        .querySelectorAll(
            ".meme-image"
        )
        .forEach(
            img =>
                img.remove()
        );


    memeImages.forEach(
        data => {

            createMemeImage(
                data
            );

        }
    );

}


/* =====================================================
   RESIZE WINDOW
===================================================== */

window.addEventListener(
    "resize",
    () => {

        balloons.forEach(
            b => {

                b.x =
                    Math.min(
                        b.x,
                        window.innerWidth - 140
                    );


                b.y =
                    Math.min(
                        b.y,
                        window.innerHeight - 190
                    );

            }
        );

    }
);
