<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>준수가 한국으로 돌아가기까지...</title>

<style>

/* =========================================================
   기본 설정
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=swap');

* {
    box-sizing: border-box;
}

html {
    margin: 0;
    padding: 0;

    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;

    font-family: 'Jua', sans-serif;

    color: #29263a;

    overflow-x: hidden;

    background: #f7f4ff;
}


/* =========================================================
   전체 페이지
========================================================= */

.page {
    width: 100%;
}


/* =========================================================
   첫 화면
========================================================= */

.hero {
    width: 100%;
    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 40px 25px;

    position: relative;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,0.95),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #e7f7ff,
            #f3e9ff,
            #fff2dc
        );
}


/* =========================================================
   제목
========================================================= */

.title {
    margin: 0;

    font-size:
        clamp(42px, 8vw, 100px);

    line-height: 1.05;

    letter-spacing: -4px;

    color: #403554;

    text-shadow:
        4px 4px 0 rgba(255,255,255,.85),
        8px 8px 0 rgba(90,70,120,.08);
}

.subtitle {
    margin-top: 22px;

    font-size:
        clamp(15px, 2vw, 22px);

    opacity: .55;
}


/* =========================================================
   날짜 입력
========================================================= */

.target-area {
    margin-top: 55px;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 12px;
}

.target-label {
    font-size: 17px;

    opacity: .55;
}

#targetDate {
    width:
        min(360px, 90vw);

    padding:
        14px
        18px;

    border: none;

    outline: none;

    border-radius: 18px;

    background:
        rgba(255,255,255,.78);

    box-shadow:
        0 10px 30px
        rgba(50,40,80,.09);

    color: #3b3548;

    font-family: inherit;

    font-size: 16px;
}


/* =========================================================
   각 카운트다운 섹션
========================================================= */

.time-section {

    width: 100%;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    position: relative;

    padding:
        80px
        25px;

    overflow: hidden;
}


/* =========================================================
   색상
========================================================= */

.year-section {
    background:
        linear-gradient(
            135deg,
            #e7ddff,
            #d9e9ff
        );
}

.month-section {
    background:
        linear-gradient(
            135deg,
            #e5dcff,
            #f7dfff
        );
}

.week-section {
    background:
        linear-gradient(
            135deg,
            #f0ddff,
            #ffe0ed
        );
}

.day-section {
    background:
        linear-gradient(
            135deg,
            #ffe1e7,
            #ffe9d4
        );
}

.hour-section {
    background:
        linear-gradient(
            135deg,
            #ffe7d1,
            #fff3c9
        );
}

.minute-section {
    background:
        linear-gradient(
            135deg,
            #fff2c9,
            #e4f4d4
        );
}

.second-section {
    background:
        linear-gradient(
            135deg,
            #dff4e0,
            #d9f1ff
        );
}


/* =========================================================
   내용
========================================================= */

.time-content {

    width:
        min(1400px, 96vw);

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}


/* =========================================================
   작은 단위 이름
========================================================= */

.unit-title {

    margin-bottom: 30px;

    font-size:
        clamp(25px, 4vw, 50px);

    opacity: .58;

    letter-spacing: 2px;
}


/* =========================================================
   엄청 큰 숫자
========================================================= */

.time-number {

    width: 100%;

    font-family:
        'Do Hyeon',
        sans-serif;

    font-size:
        clamp(
            48px,
            12vw,
            180px
        );

    line-height: 1;

    letter-spacing:
        -3px;

    white-space: nowrap;

    color: #342c43;

    text-shadow:
        5px 7px 0
        rgba(255,255,255,.7);

    transition:
        color .8s ease,
        transform .2s ease;
}


/* =========================================================
   설명
========================================================= */

.description {

    margin-top: 35px;

    font-size:
        clamp(15px, 2vw, 21px);

    opacity: .42;
}


/* =========================================================
   마지막 초 화면
========================================================= */

.second-section .time-number {

    font-size:
        clamp(
            42px,
            11vw,
            170px
        );
}


/* =========================================================
   장식
========================================================= */

.decoration {

    position: absolute;

    border-radius: 50%;

    pointer-events: none;

    opacity: .25;

    filter: blur(2px);
}

.decoration.one {

    width: 180px;
    height: 180px;

    left: 8%;
    top: 15%;

    background: white;
}

.decoration.two {

    width: 260px;
    height: 260px;

    right: 7%;
    bottom: 12%;

    background: white;
}

.decoration.three {

    width: 100px;
    height: 100px;

    right: 20%;
    top: 18%;

    background: white;
}


/* =========================================================
   모바일
========================================================= */

@media (max-width: 700px) {

    .hero {

        padding:
            30px
            18px;
    }

    .title {

        font-size:
            clamp(
                38px,
                12vw,
                65px
            );

        letter-spacing:
            -2px;
    }

    .subtitle {

        font-size: 15px;
    }

    .target-area {

        margin-top: 40px;
    }

    .time-section {

        padding:
            60px
            12px;
    }

    .time-number {

        font-size:
            clamp(
                38px,
                13vw,
                100px
            );

        letter-spacing:
            -2px;
    }

    .second-section .time-number {

        font-size:
            clamp(
                35px,
                12vw,
                95px
            );
    }

    .unit-title {

        font-size: 28px;

        margin-bottom: 22px;
    }

    .description {

        font-size: 15px;

        margin-top: 25px;
    }

    .decoration.one {

        width: 100px;
        height: 100px;
    }

    .decoration.two {

        width: 140px;
        height: 140px;
    }

    .decoration.three {

        width: 60px;
        height: 60px;
    }
}


/* =========================================================
   아주 작은 화면
========================================================= */

@media (max-width: 420px) {

    .time-number {

        font-size:
            13vw;
    }

    .second-section .time-number {

        font-size:
            12vw;
    }
}

</style>
</head>


<body>

<div class="page">


    <!-- =====================================================
         첫 화면
    ====================================================== -->

    <section class="hero">

        <h1 class="title">
            준수가 한국으로 돌아가기까지...
        </h1>

        <div class="subtitle">
            ✦ 그날까지 얼마나 남았을까? ✦
        </div>


        <div class="target-area">

            <div class="target-label">
                목표 날짜와 시간을 정해주세요
            </div>

            <input
                id="targetDate"
                type="datetime-local"
            >

        </div>

    </section>



    <!-- =====================================================
         년
    ====================================================== -->

    <section
        class="time-section year-section"
    >

        <div class="decoration one"></div>
        <div class="decoration two"></div>

        <div class="time-content">

            <div class="unit-title">
                년
            </div>

            <div
                class="time-number"
                id="years"
            >
                0.0
            </div>

            <div class="description">
                앞으로 몇 년이 남았을까
            </div>

        </div>

    </section>



    <!-- =====================================================
         달
    ====================================================== -->

    <section
        class="time-section month-section"
    >

        <div class="decoration two"></div>
        <div class="decoration three"></div>

        <div class="time-content">

            <div class="unit-title">
                달
            </div>

            <div
                class="time-number"
                id="months"
            >
                0.0
            </div>

            <div class="description">
                달로 세어보면
            </div>

        </div>

    </section>



    <!-- =====================================================
         주
    ====================================================== -->

    <section
        class="time-section week-section"
    >

        <div class="decoration one"></div>

        <div class="time-content">

            <div class="unit-title">
                주
            </div>

            <div
                class="time-number"
                id="weeks"
            >
                0.0
            </div>

            <div class="description">
                몇 주가 남았을까
            </div>

        </div>

    </section>



    <!-- =====================================================
         일
    ====================================================== -->

    <section
        class="time-section day-section"
    >

        <div class="decoration two"></div>
        <div class="decoration three"></div>

        <div class="time-content">

            <div class="unit-title">
                일
            </div>

            <div
                class="time-number"
                id="days"
            >
                0.0
            </div>

            <div class="description">
                하루하루 세어보면
            </div>

        </div>

    </section>



    <!-- =====================================================
         시간
    ====================================================== -->

    <section
        class="time-section hour-section"
    >

        <div class="decoration one"></div>

        <div class="time-content">

            <div class="unit-title">
                시간
            </div>

            <div
                class="time-number"
                id="hours"
            >
                0.0
            </div>

            <div class="description">
                시간으로 보면
            </div>

        </div>

    </section>



    <!-- =====================================================
         분
    ====================================================== -->

    <section
        class="time-section minute-section"
    >

        <div class="decoration two"></div>

        <div class="time-content">

            <div class="unit-title">
                분
            </div>

            <div
                class="time-number"
                id="minutes"
            >
                0.0
            </div>

            <div class="description">
                계속 흘러가는 시간
            </div>

        </div>

    </section>



    <!-- =====================================================
         초
    ====================================================== -->

    <section
        class="time-section second-section"
    >

        <div class="decoration one"></div>
        <div class="decoration three"></div>

        <div class="time-content">

            <div class="unit-title">
                초
            </div>

            <div
                class="time-number"
                id="seconds"
            >
                0.0
            </div>

            <div class="description">
                0.1초마다 조금씩 가까워지고 있어
            </div>

        </div>

    </section>

</div>


<script>

/* =========================================================
   요소
========================================================= */

const targetInput =
    document.getElementById(
        "targetDate"
    );

const years =
    document.getElementById(
        "years"
    );

const months =
    document.getElementById(
        "months"
    );

const weeks =
    document.getElementById(
        "weeks"
    );

const days =
    document.getElementById(
        "days"
    );

const hours =
    document.getElementById(
        "hours"
    );

const minutes =
    document.getElementById(
        "minutes"
    );

const seconds =
    document.getElementById(
        "seconds"
    );


/* =========================================================
   저장된 목표 날짜 불러오기
========================================================= */

const savedTarget =
    localStorage.getItem(
        "junsooTargetDate"
    );


if (savedTarget) {

    targetInput.value =
        savedTarget;

}


/* =========================================================
   목표 날짜 변경
========================================================= */

targetInput.addEventListener(
    "change",
    function () {

        localStorage.setItem(
            "junsooTargetDate",
            targetInput.value
        );

        updateCountdown();

    }
);


/* =========================================================
   카운트다운
========================================================= */

function updateCountdown() {

    if (!targetInput.value) {

        years.textContent = "0.0";
        months.textContent = "0.0";
        weeks.textContent = "0.0";
        days.textContent = "0.0";
        hours.textContent = "0.0";
        minutes.textContent = "0.0";
        seconds.textContent = "0.0";

        return;

    }


    const target =
        new Date(
            targetInput.value
        ).getTime();


    const now =
        Date.now();


    let difference =
        target - now;


    /* -----------------------------------------------------
       이미 지난 날짜
    ----------------------------------------------------- */

    if (difference < 0) {

        difference = 0;

    }


    /* -----------------------------------------------------
       시간 단위
    ----------------------------------------------------- */

    const SECOND =
        1000;

    const MINUTE =
        SECOND * 60;

    const HOUR =
        MINUTE * 60;

    const DAY =
        HOUR * 24;

    const WEEK =
        DAY * 7;

    /*
       평균적인 1년 길이
       365.2425일
    */

    const YEAR =
        DAY * 365.2425;

    const MONTH =
        YEAR / 12;


    /* -----------------------------------------------------
       값 계산
    ----------------------------------------------------- */

    const yearValue =
        difference / YEAR;

    const monthValue =
        difference / MONTH;

    const weekValue =
        difference / WEEK;

    const dayValue =
        difference / DAY;

    const hourValue =
        difference / HOUR;

    const minuteValue =
        difference / MINUTE;

    const secondValue =
        difference / SECOND;


    /* -----------------------------------------------------
       화면 표시
    ----------------------------------------------------- */

    years.textContent =
        yearValue.toFixed(1);

    months.textContent =
        monthValue.toFixed(1);

    weeks.textContent =
        weekValue.toFixed(1);

    days.textContent =
        dayValue.toFixed(1);

    hours.textContent =
        hourValue.toFixed(1);

    minutes.textContent =
        minuteValue.toFixed(1);

    seconds.textContent =
        secondValue.toFixed(1);

}


/* =========================================================
   0.1초마다 업데이트
========================================================= */

setInterval(
    updateCountdown,
    100
);


/* =========================================================
   처음 실행
========================================================= */

updateCountdown();

</script>

</body>
</html>
